<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF4E6">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../favicon.png">
<title>Swouf · Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E6;--card:#FFFDF9;--ink:#2A1E18;--muted:#6B5549;--line:#EBDAC6;--coral:#E86A4F;--coral-strong:#B8452D;--coral-soft:#FBE1D8;--good:#2F7A45;--good-soft:#DDF0E0;--warn:#9A5A0B;--warn-soft:#FCEBD0;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--coral-strong);font-weight:700;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:10px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.logo-icon{display:inline-block;width:44px;aspect-ratio:288/205;background:url(../refuge/swouf-logo.png) center/contain no-repeat}
.word{font-family:'Fredoka',sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1}
.word small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 4px;min-height:44px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid transparent;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;text-decoration:none}
.btn-primary{background:var(--coral-strong);color:#fff}
.btn-ghost{background:transparent;border-color:var(--ink)}
.btn-soft{background:var(--coral-soft);color:var(--coral-strong)}
.btn-danger{background:transparent;border-color:var(--coral-strong);color:var(--coral-strong)}
.btn-wide{width:100%;min-height:52px;font-size:18px}
.btn[disabled]{opacity:.6;cursor:wait}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 18px;padding:0 16px 4px;scrollbar-width:none}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px}
.tab[aria-selected=true]{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.tab .soon{font-size:12px;font-weight:600;opacity:.75;margin-left:4px}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.list{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:22px}
.count{background:var(--coral-soft);color:var(--coral-strong);font-weight:700;font-size:14px;border-radius:999px;padding:2px 10px}
.empty{color:var(--muted);font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.pending{border-color:var(--coral)}
.c-head{display:flex;align-items:center;gap:12px}
.s-logo{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.s-logo.has{font-size:0}
.c-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;line-height:1.2}
.c-sub{font-size:14px;color:var(--muted)}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.info dt{color:var(--muted);font-weight:700}
.info dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px}
.tag-good{background:var(--good-soft);color:var(--good)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-bad{background:var(--coral-soft);color:var(--coral-strong)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;width:100%}
.row .grow{flex:1;min-width:0}
.row .chev{color:var(--muted);font-size:22px}
.dogs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dog{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px}
.dog.off{opacity:.65}
.d-photo{width:60px;height:60px;border-radius:14px;background:var(--coral-soft) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.d-photo.has{font-size:0}
.msg{border-radius:18px;padding:14px 16px;font-weight:600}
.msg-warn{background:var(--warn-soft);color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.chip[aria-pressed=true]{border-color:var(--coral-strong);background:var(--coral-soft);color:var(--coral-strong)}
.fb.done{opacity:.6}
.stars{color:var(--coral);font-size:18px;letter-spacing:2px}
.fb-msg{white-space:pre-wrap;overflow-wrap:anywhere}
.vform{display:flex;flex-direction:column;gap:6px}
.vform input{width:100%;min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 12px;font:inherit}
.vform input:focus{border-color:var(--coral);outline:none}
.vform .lbl{font-weight:700;font-size:14px;margin-top:6px}
.vrow{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.err{color:var(--coral-strong);font-size:14px;font-weight:600;margin:4px 0 0}.err:empty{display:none}
#vetDlg{width:min(460px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.tile b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:30px;line-height:1.1}
.tile span{font-size:14px;color:var(--muted);font-weight:600}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.hb .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.hb .fl{display:block;height:100%;background:var(--coral);border-radius:4px}
.hb b{font-weight:700;min-width:2ch;text-align:right}
.tab b.tabn{background:var(--coral-strong);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:5px}
.soon-box{background:var(--card);border:2px dashed var(--line);border-radius:22px;padding:22px;text-align:center;color:var(--muted)}
.soon-box h2{color:var(--ink);margin-bottom:8px}
.soon-box ul{text-align:left;display:inline-block;margin:10px 0 0}
details.more summary{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;cursor:pointer;min-height:40px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--coral-strong)}
dialog{border:0;border-radius:24px;padding:22px;max-width:min(420px,calc(100% - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(42,30,24,.25)}
dialog::backdrop{background:rgba(42,30,24,.45)}
dialog h2{font-size:22px;margin-bottom:8px}
.c-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);text-align:center;z-index:50}
.center{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="./"><span class="logo-icon" aria-hidden="true"></span><span class="word">Swouf<small data-i18n="admin"></small></span></a>
    <button class="linkbtn hidden" id="logout" data-i18n="logout"></button>
  </div>

  <!-- Connexion -->
  <section id="login" class="hidden" style="padding-top:18vh">
    <h1 class="center" data-i18n="loginT"></h1>
    <p class="center empty" style="margin:10px 0 22px" data-i18n="loginP"></p>
    <button class="btn btn-primary btn-wide" id="login-btn" data-i18n="loginBtn"></button>
  </section>
  <section id="denied" class="hidden" style="padding-top:18vh">
    <h1 class="center" data-i18n="deniedT"></h1>
    <p class="center empty" style="margin-top:10px" data-i18n="deniedP"></p>
  </section>
  <p id="loading" class="center empty" style="padding-top:40vh" data-i18n="loading"></p>

  <!-- Espace administration -->
  <main id="app" class="hidden">
    <nav class="tabs" role="tablist" id="tabs"></nav>

    <!-- Onglet Refuges -->
    <div id="tab-refuges" role="tabpanel">
      <div id="r-list">
        <section class="sec">
          <div class="sec-h"><h2 data-i18n="pendingT"></h2><span class="count" id="n-pending"></span></div>
          <div id="pending" class="list"></div>
        </section>
        <section class="sec">
          <div class="sec-h"><h2 data-i18n="activeT"></h2><span class="count" id="n-active"></span></div>
          <div id="active" class="list"></div>
        </section>
        <section class="sec" id="deletion-sec">
          <div class="sec-h"><h2 data-i18n="deletionT"></h2><span class="count" id="n-deletion"></span></div>
          <div id="deletion" class="list"></div>
        </section>
        <details class="more sec">
          <summary><span data-i18n="othersT"></span> (<span id="n-others"></span>)</summary>
          <div id="others" class="list" style="margin-top:10px"></div>
        </details>
        <section class="sec">
          <h2 data-i18n="backupT"></h2>
          <p class="empty" data-i18n="backupP"></p>
          <button class="btn btn-ghost" id="export" data-i18n="backupBtn"></button>
        </section>
      </div>
      <div id="r-detail" class="hidden"></div>
    </div>

    <!-- Onglet Avis -->
    <div id="tab-avis" role="tabpanel" class="hidden">
      <section class="sec">
        <div class="sec-h"><h2 data-i18n="avisT"></h2><span class="count" id="a-count"></span></div>
        <p class="empty" id="a-summary"></p>
        <div class="filters" id="a-filters"></div>
        <label class="switch"><input type="checkbox" id="a-hideDone"><span data-i18n="hideDone"></span></label>
        <div class="list" id="a-list"></div>
        <button class="btn btn-ghost" id="a-export" data-i18n="avisExport"></button>
      </section>
    </div>

    <!-- Onglet Vétérinaires -->
    <div id="tab-vets" role="tabpanel" class="hidden">
      <section class="sec">
        <div class="sec-h"><h2 data-i18n="vetPendT"></h2><span class="count" id="v-npend"></span></div>
        <div class="list" id="v-pending"></div>
      </section>
      <section class="sec">
        <div class="sec-h"><h2 data-i18n="vetAddedT"></h2><span class="count" id="v-nadded"></span></div>
        <p class="empty" data-i18n="vetAddedP"></p>
        <button class="btn btn-soft" id="v-new" data-i18n="vetNew"></button>
        <div class="list" id="v-added"></div>
      </section>
    </div>

    <!-- Onglets à venir -->
    <!-- Onglet Inscrits -->
    <div id="tab-signups" role="tabpanel" class="hidden">
      <section class="sec">
        <div class="sec-h"><h2 data-i18n="tabSignups"></h2><span class="count" id="su-count"></span></div>
        <div class="list" id="su-list"></div>
        <button class="btn btn-ghost" id="su-export" data-i18n="exportCsv"></button>
      </section>
    </div>

    <!-- Onglet Newsletter -->
    <div id="tab-news" role="tabpanel" class="hidden">
      <section class="sec">
        <div class="sec-h"><h2 data-i18n="tabNews"></h2><span class="count" id="nl-count"></span></div>
        <p class="empty" data-i18n="newsP"></p>
        <div class="list" id="nl-list"></div>
        <button class="btn btn-ghost" id="nl-export" data-i18n="exportCsv"></button>
      </section>
    </div>

    <!-- Onglet Suppressions -->
    <div id="tab-del" role="tabpanel" class="hidden">
      <section class="sec">
        <div class="sec-h"><h2 data-i18n="delT"></h2><span class="count" id="dr-count"></span></div>
        <p class="empty" data-i18n="delP"></p>
        <div class="list" id="dr-list"></div>
      </section>
    </div>

    <!-- Onglet Statistiques -->
    <div id="tab-stats" role="tabpanel" class="hidden">
      <div class="tiles" id="st-tiles"></div>
      <section class="sec"><h2 data-i18n="stBreeds"></h2><div id="st-breeds"></div></section>
      <section class="sec"><h2 data-i18n="stRegions"></h2><div id="st-regions"></div></section>
      <p class="empty" data-i18n="stSoon"></p>
    </div>
    <div id="tab-shops" role="tabpanel" class="hidden"><div class="soon-box"><h2 data-i18n="shopsT"></h2><p data-i18n="soonP"></p><p style="margin-top:10px" data-i18n="shopsP"></p></div></div>
  </main>

  <dialog id="vetDlg" aria-labelledby="vd-title">
    <form id="vetForm" class="vform" novalidate>
      <h2 id="vd-title"></h2>
      <p class="empty hidden" id="vd-orig"></p>
      <label class="lbl" for="vd-name" data-i18n="vName"></label><input id="vd-name" maxlength="150">
      <label class="lbl" for="vd-address" data-i18n="vAddress"></label><input id="vd-address" maxlength="200">
      <div class="vrow"><div><label class="lbl" for="vd-zip" data-i18n="vZip"></label><input id="vd-zip" inputmode="numeric" maxlength="4"></div><div><label class="lbl" for="vd-city" data-i18n="vCity"></label><input id="vd-city" maxlength="80"></div></div>
      <label class="lbl" for="vd-phone" data-i18n="vPhone"></label><input id="vd-phone" type="tel" maxlength="40">
      <label class="lbl" for="vd-web" data-i18n="vWeb"></label><input id="vd-web" type="url" maxlength="300" placeholder="https://">
      <p class="err" id="vd-err"></p>
      <div class="c-btns"><button class="btn btn-ghost" type="button" id="vd-cancel" data-i18n="cancel"></button><button class="btn btn-primary" type="submit" id="vd-save"></button></div>
    </form>
  </dialog>

  <dialog id="confirm" aria-labelledby="c-title">
    <h2 id="c-title"></h2>
    <p id="c-text"></p>
    <div class="c-btns"><button class="btn btn-ghost" id="c-no" data-i18n="cancel"></button><button class="btn btn-primary" id="c-yes"></button></div>
  </dialog>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

function askConfirm(title, text, yesLabel, onYes){

async function setShelter(id, patch){ const { error } = await sb.from('shelters').update(patch).eq('id', id); if(error) throw error; await loadRefuges(); }
async function deleteShelter(id){
  /* d'abord les photos et le logo (dossier du refuge), puis le refuge : son équipe et ses chiens partent avec lui */
  const { data: files, error: le } = await sb.storage.from('refuges').list(id, {limit:1000});
  if(le) throw le;
  if(files && files.length){ const { error } = await sb.storage.from('refuges').remove(files.map(f=>id+'/'+f.name)); if(error) throw error; }
  const { error } = await sb.from('shelters').delete().eq('id', id);
  if(error) throw error;
  current = null; closeShelter(); await loadRefuges();
}
document.addEventListener('click', e => {
  const open = e.target.closest('[data-open]'); if(open){ openShelter(open.dataset.open); return; }
  const h = e.target.closest('[data-hide]');
  if(h){ const d = dogs.find(x=>x.id===h.dataset.hide); h.disabled = true;
    sb.from('shelter_dogs').update({hidden_by_admin:!d.hidden_by_admin}).eq('id', d.id).then(({error})=>{ if(error) toast(T('errAction')); return loadRefuges(); }); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const s = shelters.find(x=>x.id===b.dataset.id); if(!s) return;
  const n = {name:s.name}, act = b.dataset.act;
  if(act==='validate')   askConfirm(T('validateQ',n), T('validateP'), T('validate'), ()=>setShelter(s.id, {status:'actif'}));
  if(act==='refuse')     askConfirm(T('refuseQ',n), T('refuseP'), T('refuse'), ()=>setShelter(s.id, {status:'refuse'}));
  if(act==='suspend')    askConfirm(T('suspendQ',n), T('suspendP'), T('suspend'), ()=>setShelter(s.id, {status:'suspendu'}));
  if(act==='reactivate') askConfirm(T(s.status==='en_attente'?'validateQ':'reactivateQ',n), T(s.status==='en_attente'?'validateP':'reactivateP'), T(s.status==='en_attente'?'validate':'reactivate'), ()=>setShelter(s.id, {status:'actif'}));
  if(act==='delete')     askConfirm(T('deleteQ',n), T('deleteP'), T('delete'), ()=>deleteShelter(s.id));
});

function openVetForm(mode, data, prop){

  $('#vd-title').textContent = T(mode==='approve' ? 'vdApprove' : mode==='edit' ? 'vdEdit' : 'vdNew');

  $('#vd-name').value = v.name || ''; $('#vd-address').value = v.address || ''; $('#vd-zip').value = v.postal_code || ''; $('#vd-city').value = v.city || '';
  $('#vd-phone').value = v.phone || ''; $('#vd-web').value = v.website || ''; $('#vd-err').textContent = '';

$('#vetForm').onsubmit = async e => {
  e.preventDefault();
  const g = id => $('#vd-'+id).value.trim();
  let web = g('web'); if(web && !/^https?:\/\//i.test(web)) web = 'https://'+web;
  const row = {name:g('name'), address:g('address'), postal_code:g('zip').replace(/\s/g,''), city:g('city'), phone:g('phone')||null, website:web||null};
  if(row.name.length<2 || !row.address || !row.city || !/^\d{4}$/.test(row.postal_code)){ $('#vd-err').textContent = T('vdErr'); return; }
  const b = $('#vd-save'); b.disabled = true;
  try{
    const q = vetEditing.mode==='edit' ? sb.from('vets_added').update(row).eq('id', vetEditing.id) : sb.from('vets_added').insert(row);
    const { error } = await q; if(error) throw error;
    if(vetEditing.propId){ const r = await sb.from('app_feedback').update({handled:true}).eq('id', vetEditing.propId); if(r.error) throw r.error; }
    $('#vetDlg').close(); toast(T('done')); await loadVets();
  }catch(err){ console.error(err); toast(T('errAction')); }
  finally{ b.disabled = false; }
};
$('#v-new').onclick = () => openVetForm('new');
$('#tab-vets').addEventListener('click', async e => {
  const ap = e.target.closest('[data-vapprove]'); if(ap){ const p = vetProps.find(x=>x.id===ap.dataset.vapprove); openVetForm('approve', p.details||{}, p); return; }
  const rj = e.target.closest('[data-vreject]'); if(rj){ askConfirm(T('rejectQ'), T('rejectP'), T('reject'), async()=>{ const { error } = await sb.from('app_feedback').update({handled:true}).eq('id', rj.dataset.vreject); if(error) throw error; await loadVets(); }); return; }
  const ed = e.target.closest('[data-vedit]'); if(ed){ openVetForm('edit', vets.find(x=>x.id===ed.dataset.vedit)); return; }
  const hd = e.target.closest('[data-vhide]'); if(hd){ const v = vets.find(x=>x.id===hd.dataset.vhide); hd.disabled = true; const { error } = await sb.from('vets_added').update({hidden:!v.hidden}).eq('id', v.id); if(error) toast(T('errAction')); await loadVets(); return; }
  const dl = e.target.closest('[data-vdel]'); if(dl){ const v = vets.find(x=>x.id===dl.dataset.vdel); askConfirm(T('vDelQ', {name:v.name}), T('vDelP'), T('del'), async()=>{ const { error } = await sb.from('vets_added').delete().eq('id', v.id); if(error) throw error; await loadVets(); }); }
});

/* Lit tout un tableau, même au-delà de 1000 lignes (limite de Supabase par demande) */
async function fetchAll(table, order){
  const out = [];
  for(let from=0;;from+=1000){
    const { data, error } = await sb.from(table).select('*').order(order, {ascending:false}).range(from, from+999);
    if(error) throw error;
    out.push(...data); if(data.length<1000) return out;
  }
}
function downloadCsv(name, rows){
  const cell = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const blob = new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\n')], {type:'text/csv;charset=utf-8'});
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = name+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(l.href), 2000);
}
const COUNTRY = {BE:'Belgique', 'BE-BRU':'Belgique · Bruxelles', 'BE-WAL':'Belgique · Wallonie', 'BE-FLA':'Belgique · Flandre', FR:'France', LU:'Luxembourg', NL:'Pays-Bas', CH:'Suisse', CA:'Canada', DE:'Allemagne'};
const place = (c,z) => [z, COUNTRY[c]||c].filter(Boolean).join(' · ');

/* ===== Onglet Inscrits ===== */
let signups = [];
async function loadSignups(){
  try{ signups = await fetchAll('app_signups','created_at'); }catch(e){ toast(T('errLoad')); return; }
  $('#su-count').textContent = signups.length;
  $('#su-list').innerHTML = signups.length ? signups.map(u=>`
    <article class="card">
      <div class="c-name">${esc(u.first_name||'—')}</div>
      <p>${u.email?esc(u.email):`<span class="c-sub">${esc(T('suNoEmail'))}</span>`}</p>
      <p class="c-sub">${esc(place(u.country,u.zip))} · ${esc((u.lang||'').toUpperCase())} · ${esc(fmtDate(u.created_at))}</p>
      <div><span class="tag ${u.newsletter?'tag-good':'tag-warn'}">${esc(T(u.newsletter?'suNews':'suNoNews'))}</span></div>
    </article>`).join('') : `<p class="empty">${esc(T('suNone'))}</p>`;
}
$('#su-export').onclick = () => downloadCsv('swouf-inscrits', [['date','prénom','e-mail','langue','pays','code postal','newsletter']].concat(signups.map(u=>[u.created_at.slice(0,10),u.first_name,u.email,u.lang,COUNTRY[u.country]||u.country,u.zip,u.newsletter?'oui':'non'])));

/* ===== Onglet Newsletter ===== */
let news = [];
async function loadNews(){
  try{ news = await fetchAll('newsletter_subscribers','created_at'); }catch(e){ toast(T('errLoad')); return; }
  renderNews();
}
function renderNews(){
  $('#nl-count').textContent = news.filter(n=>!n.unsubscribed_at).length;
  $('#nl-list').innerHTML = news.length ? news.map(n=>`
    <article class="card${n.unsubscribed_at?' fb done':''}">
      <div class="c-name" style="overflow-wrap:anywhere">${esc(n.email)}</div>
      <p class="c-sub">${esc([n.first_name, place(n.country,n.zip), (n.lang||'').toUpperCase(), fmtDate(n.created_at)].filter(Boolean).join(' · '))}</p>
      ${n.unsubscribed_at?`<div><span class="tag tag-warn">${esc(T('nlOff'))}</span></div>`:''}
      <div class="acts"><button class="btn btn-soft" data-nloff="${n.id}">${esc(T(n.unsubscribed_at?'nlResub':'nlUnsub'))}</button><button class="btn btn-danger" data-nldel="${n.id}">${esc(T('del'))}</button></div>
    </article>`).join('') : `<p class="empty">${esc(T('nlNone'))}</p>`;
}
$('#nl-list').onclick = async e => {
  const off = e.target.closest('[data-nloff]');
  if(off){ const n = news.find(x=>x.id===off.dataset.nloff); off.disabled = true; const v = n.unsubscribed_at ? null : new Date().toISOString();
    const { error } = await sb.from('newsletter_subscribers').update({unsubscribed_at:v}).eq('id', n.id);
    if(error) toast(T('errAction')); else n.unsubscribed_at = v; renderNews(); return; }
  const d = e.target.closest('[data-nldel]');
  if(d){ const n = news.find(x=>x.id===d.dataset.nldel); askConfirm(T('nlDelQ',{email:n.email}), T('nlDelP'), T('del'), async()=>{ const { error } = await sb.from('newsletter_subscribers').delete().eq('id', n.id); if(error) throw error; news = news.filter(x=>x.id!==n.id); renderNews(); }); }
};
$('#nl-export').onclick = () => downloadCsv('swouf-newsletter', [['e-mail','prénom','langue','pays','code postal','date']].concat(news.filter(n=>!n.unsubscribed_at).map(n=>[n.email,n.first_name,n.lang,COUNTRY[n.country]||n.country,n.zip,n.created_at.slice(0,10)])));

/* ===== Onglet Suppressions : demandes « Effacer mes données » (délai légal : 1 mois) ===== */
let delReqs = [];
async function loadDel(){
  try{ delReqs = await fetchAll('user_deletion_requests','created_at'); }catch(e){ toast(T('errLoad')); return; }
  renderDel();
}
function renderDel(){
  const todo = delReqs.filter(r=>!r.handled).length;
  $('#dr-count').textContent = todo;
  const tab = $('#t-del'); if(tab) tab.innerHTML = esc(T('tabDel'))+(todo?`<b class="tabn">${todo}</b>`:'');
  /* à traiter d'abord, les plus anciennes en premier */
  const list = delReqs.slice().sort((a,b)=>(a.handled-b.handled)||(a.handled?new Date(b.created_at)-new Date(a.created_at):new Date(a.created_at)-new Date(b.created_at)));
  $('#dr-list').innerHTML = list.length ? list.map(r=>{ const lim = new Date(r.created_at); lim.setMonth(lim.getMonth()+1); const late = lim < new Date();
    return `<article class="card${r.handled?' fb done':' pending'}">
      <div class="c-name" style="overflow-wrap:anywhere">${esc(r.first_name||'—')}${r.email?' · '+esc(r.email):''}</div>
      <p class="c-sub">${esc([r.zip, fmtDate(r.created_at)].filter(Boolean).join(' · '))}</p>
      ${r.handled?`<div><span class="tag tag-good">${esc(T('doneTag'))}</span></div>`:`<div><span class="tag ${late?'tag-bad':'tag-warn'}">${esc(T(late?'drLate':'drDeadline',{d:fmtDate(lim.toISOString())}))}</span></div>`}
      ${!r.handled&&!r.email?`<p class="c-sub">${esc(T('drNoEmail'))}</p>`:''}
      <div class="acts">${!r.handled&&r.email?`<button class="btn btn-primary" data-drerase="${r.id}">${esc(T('drErase'))}</button>`:''}<button class="btn btn-soft" data-drdone="${r.id}">${esc(T(r.handled?'drTodo':'drDone'))}</button></div>
    </article>`; }).join('') : `<p class="empty">${esc(T('drNone'))}</p>`;
}
$('#dr-list').onclick = async e => {
  const d = e.target.closest('[data-drdone]');
  if(d){ const r = delReqs.find(x=>x.id===d.dataset.drdone); d.disabled = true; const { error } = await sb.from('user_deletion_requests').update({handled:!r.handled}).eq('id', r.id);
    if(error) toast(T('errAction')); else r.handled = !r.handled; renderDel(); return; }
  const x = e.target.closest('[data-drerase]');
  if(x){ const r = delReqs.find(y=>y.id===x.dataset.drerase); askConfirm(T('drEraseQ',{email:r.email}), T('drEraseP'), T('drErase'), async()=>{ const { error } = await sb.rpc('admin_erase_user',{request_id:r.id}); if(error) throw error; r.handled = true; renderDel(); }); }
};

/* ===== Onglet Statistiques ===== */
async function loadStats(){
  const { data, error } = await sb.rpc('admin_stats');
  if(error){ toast(T('errLoad')); return; }
  renderStats(data);
}
function renderStats(d){
  const fmt = n => Number(n).toLocaleString('fr-BE');
  $('#st-tiles').innerHTML = [['stTests',d.tests_total],['st30',d.tests_30d],['stSignups',d.signups],['stNews',d.newsletter]].map(([k,n])=>`<div class="tile"><b>${fmt(n)}</b><span>${esc(T(k))}</span></div>`).join('');
  const bars = (rows, label) => { if(!rows.length) return `<p class="empty">${esc(T('stNone'))}</p>`; const max = Math.max(...rows.map(r=>r.n));
    return rows.map(r=>`<div class="hb" title="${esc(label(r.name))} : ${fmt(r.n)}"><span>${esc(label(r.name))}</span><span class="tr"><span class="fl" style="width:${Math.round(r.n/max*100)}%"></span></span><b>${fmt(r.n)}</b></div>`).join(''); };
  $('#st-breeds').innerHTML = bars(d.top_breeds, n=>n);
  $('#st-regions').innerHTML = bars(d.by_region, n=>COUNTRY[n]||n);
}

/* ===== Démarrage : la vraie protection est dans Supabase ; cette vérification sert seulement à afficher le bon écran ===== */
let started = false;
sb.auth.onAuthStateChange((ev, session) => {
  if(ev!=='INITIAL_SESSION' && ev!=='SIGNED_IN') return;
  setTimeout(async () => {
    if(!session){ view('login'); return; }
    $('#logout').classList.remove('hidden');
    const { data: ok } = await sb.rpc('is_admin');
    if(!ok){ view('denied'); return; }
    view('app');
    if(!started){ started = true; buildTabs(); openTab('refuges'); loadDel(); }
  }, 0);
});
