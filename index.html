<style>:root{--bg:#FFF4E6;--card:#FFFDF9;--ink:#2A1E18;--muted:#6B5549;--line:#EBDAC6;--coral:#E86A4F;--coral-strong:#B8452D;--coral-soft:#FBE1D8;--good:#2F7A45;--good-soft:#DDF0E0;--warn:#9A5A0B;--warn-soft:#FCEBD0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding:16px 18px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hidden{display:none!important}
.screen{display:flex;flex-direction:column;gap:18px;flex:1}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink)}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 0 4px}
.hero .logo-icon{width:96px}.hero .word{font-size:clamp(50px,15vw,64px)}
.slogan{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,5.8vw,26px);margin:6px 0 0}
.tagline{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--coral-strong);margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.topbar .logo-icon{width:44px}.topbar .word{font-size:25px}
.home-btn{background:none;border:0;padding:4px 0;min-height:44px;display:flex;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 4px;min-height:44px;font-size:15px}
.linkbtn:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;text-decoration:none;width:100%}
.btn-primary{background:var(--coral-strong);color:#fff}.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-soft{background:var(--card);border-color:var(--line);color:var(--ink)}
.form,.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px}
.form{display:flex;flex-direction:column;gap:14px}
.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input,.field select,textarea{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px}
textarea{min-height:90px;padding:10px 14px;resize:vertical}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--coral);outline:none}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.help{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.err{color:var(--coral-strong);font-size:14px;font-weight:600;margin:4px 0 0}.err:empty{display:none}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-btn{min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.lang-btn[aria-pressed=true]{border-color:var(--coral-strong);background:var(--coral-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--coral-strong);flex:none}
.small{font-size:13.5px;color:var(--muted);margin:0}
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;margin-top:6px}
.legal-links button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px}
/* Accueil connecté */
.hello{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600;text-align:center;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:12px}
/* Tutoriel */
.tuto-demo{position:relative;height:220px;border-radius:24px;background:#FCE7DC;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tuto-card{width:170px;height:150px;background:var(--card);border:2px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;position:relative;animation:tutoSwipe 4s ease-in-out infinite}
.tuto-card .st{position:absolute;top:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;border:3px solid;border-radius:8px;padding:0 8px;opacity:0}
.tuto-card .st.y{left:10px;color:var(--good);animation:tutoYes 4s infinite}
.tuto-card .st.n{right:10px;color:var(--coral-strong);animation:tutoNo 4s infinite}
.tuto-hand{position:absolute;font-size:40px;bottom:6px;left:50%;animation:tutoHand 4s ease-in-out infinite}
@keyframes tutoSwipe{0%,10%{transform:none}30%,40%{transform:translateX(70px) rotate(10deg)}50%,60%{transform:none}80%,90%{transform:translateX(-70px) rotate(-10deg)}100%{transform:none}}
@keyframes tutoHand{0%,10%{transform:translateX(-50%)}30%,40%{transform:translateX(20px)}50%,60%{transform:translateX(-50%)}80%,90%{transform:translateX(-120px)}100%{transform:translateX(-50%)}}
@keyframes tutoYes{0%,15%{opacity:0}30%,40%{opacity:1}50%,100%{opacity:0}}
@keyframes tutoNo{0%,65%{opacity:0}80%,90%{opacity:1}100%{opacity:0}}
.tuto-legend{display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:15px}
.tuto-legend .y{color:var(--good);text-align:right}.tuto-legend .n{color:var(--coral-strong)}
.note-box{background:var(--coral-soft);border-radius:18px;padding:14px 16px;font-weight:600}
/* Quiz */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--coral);border-radius:99px;transition:width .3s ease}
.theme-label{color:var(--muted);font-weight:600;font-size:15px;margin:0}
.encourage{background:var(--good-soft);color:var(--good);font-weight:700;border-radius:14px;padding:8px 14px;text-align:center;font-size:15px}
.stage{position:relative;flex:1;min-height:360px;display:flex}
.card{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px 22px 26px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;box-shadow:0 18px 40px -24px rgba(42,30,24,.35)}
.card.behind{transform:scale(.95) translateY(14px);opacity:.6;box-shadow:none}
.illu{height:150px;margin:-6px -6px 16px;border-radius:20px;background:#FCE7DC;overflow:hidden}
.illu svg{width:100%;height:100%;display:block}
.card .q{font-family:'Fredoka',sans-serif;font-size:clamp(21px,5.6vw,26px);font-weight:600;line-height:1.22}
.card .hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.stamp{position:absolute;top:24px;padding:4px 14px;border-radius:12px;border:3px solid;font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;opacity:0;pointer-events:none;background:var(--card)}
.stamp.yes{left:20px;color:var(--good);border-color:var(--good);transform:rotate(-10deg)}
.stamp.no{right:20px;color:var(--coral-strong);border-color:var(--coral-strong);transform:rotate(10deg)}
.controls{display:flex;align-items:center;justify-content:center;gap:26px}
.round{width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--card);font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;gap:2px}
.round svg{width:24px;height:24px}
.round.yes{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.under{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.count{font-variant-numeric:tabular-nums}
/* Résultats */
#r-title{font-size:clamp(26px,7vw,32px)}
.lead{color:var(--muted);margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.match.first{border-color:var(--coral)}
.match h2{font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--coral-strong);line-height:1}
.pct small{font-size:12px;font-weight:500;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--coral);border-radius:99px}
.facts{margin:0;font-size:12.5px;line-height:1.35}
.facts div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding:2px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:700;text-align:right}
.car{margin:0;font-size:13px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.tags li{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:700;line-height:1.35}
.tags.good li{background:var(--good-soft);color:var(--good)}.tags.warn li{background:var(--warn-soft);color:var(--warn)}
.vig{font-size:12px;color:var(--muted);margin:0;line-height:1.35}
.cross{display:inline-block;vertical-align:middle;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.panel h3{font-size:20px;margin-bottom:8px}.panel p{margin:0 0 10px}.panel ul{margin:0;padding-left:20px}.panel li{margin-bottom:6px}
.panel.ebook{background:var(--coral-soft);border-color:var(--coral)}
.panel.refuge{border-style:dashed}
.more{display:flex;flex-direction:column;gap:10px}
.mini-match{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.mini-match summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer;min-height:54px}
.mini-match summary::-webkit-details-marker{display:none}
.mm-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;line-height:1.2}
.mm-name small{display:block;font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:var(--muted)}
.mm-pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;color:var(--coral-strong)}
.mm-body{padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.wish select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 12px;margin-bottom:10px}
.stars{display:flex;gap:6px;margin:4px 0 12px}
.stars button{background:none;border:0;font-size:32px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:#F2A93B}
.hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.hist-item small{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(42,30,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:24px;margin-bottom:10px}.sheet h3{font-size:18px;margin:16px 0 6px}.sheet p{margin:0 0 8px;font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.ref-list{list-style:none;padding:0!important;margin:12px 0 0!important;display:flex;flex-direction:column;gap:10px}
.ref-item{background:var(--bg);border-radius:16px;padding:12px 14px}
.ref-item strong{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;line-height:1.25}
.ref-item small{color:var(--muted);display:block;margin:2px 0 8px}
.ref-links{display:flex;gap:8px;flex-wrap:wrap}
.ref-links a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.section-title{font-size:20px;margin:6px 0 -6px}
/* ===== Mise à jour 2 ===== */
p,h1,h2,h3,li,.card .q,.note-box{text-wrap:pretty}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inline-link{background:none;border:0;padding:0;color:var(--coral-strong);font-weight:700;text-decoration:underline;font-size:14px;text-align:left;align-self:flex-start;min-height:32px}
/* Quiz : tout tient sur un écran */
#quiz{min-height:calc(100dvh - 56px);gap:12px}
#quiz .stage{flex:1;min-height:300px}
.card{padding:14px 14px 20px;justify-content:flex-end;gap:12px}
.card .illu{flex:1;height:auto;min-height:120px;margin:0;border-radius:20px}
.card .illu svg{height:100%}
.card .q{margin:0 6px}
.card .hint{margin:-4px 6px 0}
.controls{gap:16px;padding:4px 0}
.round{border:0;box-shadow:0 6px 18px -8px rgba(42,30,24,.45);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;padding:0}
.round.big{width:72px;height:72px}
.round.big svg{width:32px;height:32px}
.round.small{width:54px;height:54px}
.round.small svg{width:24px;height:24px}
.round.no{color:var(--ink);border:2px solid var(--ink)}
.round.yes{color:#fff;background:var(--coral-strong)}
.round.back{color:#E0A100;border:2px solid #F2C94C}
.round.joker{color:#5B6FD6;border:2px solid #AEB9F0;gap:1px}
.round.joker svg{width:20px;height:20px}
.lbl-mini{font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;line-height:1}
.round:disabled{opacity:.35}
.count{text-align:center;color:var(--muted);font-size:14px;margin:0;font-variant-numeric:tabular-nums}
/* Historique : glisser pour supprimer */
.hist-row{position:relative;border-radius:18px;overflow:hidden;background:#C2452F}
.hist-row .del{position:absolute;right:0;top:0;bottom:0;width:100px;border:0;background:#C2452F;color:#fff;font-weight:700;font-size:15px}
.hist-row .hist-item{position:relative;transition:transform .2s ease;touch-action:pan-y}
/* Fiche race */
.match .see{background:none;border:0;padding:6px 0 0;color:var(--coral-strong);font-weight:700;font-size:13px;text-align:left;min-height:32px}
.d-head{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.d-head h2{font-size:26px;margin:0}
.d-sub{color:var(--muted);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.gauges{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.gauge{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:14px}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--coral)}
.tip{background:var(--coral-soft);border-radius:16px;padding:12px 14px;margin:0}
/* Toast avec annulation */
.toast{display:flex;align-items:center;gap:14px}
.toast.show{pointer-events:auto}
#toast-undo{background:none;border:0;color:#F2C94C;font-weight:800;padding:4px 0}

/* cartes ajustées à leur contenu, sans vide */
#quiz{min-height:0}
#quiz .stage{flex:0 0 auto;min-height:0;position:relative}
#quiz .card{position:relative;inset:auto}
#quiz .card.behind{position:absolute;inset:0}
.card .illu{flex:none;aspect-ratio:320/200;width:100%;min-height:0}

.about-pill{align-self:center;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border-radius:99px;border:2px solid var(--coral);background:var(--coral-soft);color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px}
.about-pill:hover{background:#F8D3C6}

.card .illu{aspect-ratio:auto!important;height:0!important;padding-top:62.5%;position:relative;flex:none!important;width:100%}
.card .illu svg{position:absolute;inset:0;width:100%;height:100%}
.hint1{text-align:center;color:var(--muted);font-size:14px;margin:-6px 0 0;min-height:0}
.hint1:empty{display:none}

#quiz .stage{display:block}
#quiz .card{width:100%;box-sizing:border-box}

/* toutes les cartes ont exactement la même taille */
.card .q-box{height:calc(3 * 1.22 * clamp(21px,5.6vw,26px));display:flex;align-items:center;margin:0 6px;overflow:hidden}
.card .q-box .q{margin:0;font-size:clamp(21px,5.6vw,26px);line-height:1.22}

.round{position:relative;overflow:visible}
.under-lbl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;line-height:1}
.round.joker svg{width:24px;height:24px}
.controls{padding-bottom:22px}

.share-tip{margin:0;text-align:center;font-weight:700;color:var(--coral-strong);font-size:15px}
</style>
</head>

"aboutT": "À propos de Swoof",
"about": "<p><strong>Notre mission :</strong> aider chacun à trouver le chien fait pour sa vie. Trop de chiens sont abandonnés parce que leur race ne correspondait pas au mode de vie de leur famille. Swoof t'aide à écouter ton cœur, mais aussi ton quotidien.</p><h3>Comment ça marche ?</h3><p>Tu réponds par oui ou non à une quarantaine de questions sur ta vie. Swoof compare tes réponses avec plus de 100 races et te propose celles qui te correspondent le mieux, ainsi que les refuges proches de chez toi.</p><h3>Qui se cache derrière Swoof ?</h3><p>Swoof est né de ma propre expérience. Quand j'ai décidé d'accueillir un chien, mon cœur penchait pour un corgi : c'était ma race coup de cœur. Mais en y regardant de plus près, il n'aurait pas pu me suivre dans mes aventures, notamment en avion. Après beaucoup de recherches, une race est ressortie comme celle qui correspondait vraiment à ma vie : le teckel. Et je n'ai jamais regretté ce choix ! 🐾</p><p>C'est cette démarche que Swoof veut rendre accessible à tous.</p><p><em>Julie, fondatrice de Swoof</em></p><h3>Une app en phase de test</h3><p>Swoof grandit grâce à tes avis. N'hésite pas à nous dire ce que tu en penses à la fin du quiz.</p><h3>Nous contacter</h3><p><a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a></p>",

"aboutT": "About Swoof",
"about": "<p><strong>Our mission:</strong> help everyone find the dog made for their life. Too many dogs are abandoned because their breed didn't suit their family's lifestyle. Swoof helps you listen to your heart, but also to your daily life.</p><h3>How does it work?</h3><p>You answer yes or no to about forty questions about your life. Swoof compares your answers with more than 100 breeds and suggests the ones that suit you best, as well as shelters near you.</p><h3>Who's behind Swoof?</h3><p>Swoof was born from my own experience. When I decided to welcome a dog, my heart was set on a corgi: it was my favourite breed. But looking more closely, it couldn't have followed me on my adventures, especially by plane. After a lot of research, one breed stood out as the one that truly suited my life: the dachshund. And I've never regretted that choice! 🐾</p><p>That's the approach Swoof wants to make accessible to everyone.</p><p><em>Julie, founder of Swoof</em></p><h3>An app in its test phase</h3><p>Swoof grows thanks to your feedback. Feel free to tell us what you think at the end of the quiz.</p><h3>Contact us</h3><p><a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a></p>",

"about": "<p><strong>Onze missie:</strong> iedereen helpen de hond te vinden die bij zijn leven past. Te veel honden worden afgestaan omdat hun ras niet bij de levensstijl van hun gezin paste. Swoof helpt je te luisteren naar je hart, maar ook naar je dagelijks leven.</p><h3>Hoe werkt het?</h3><p>Je antwoordt ja of nee op een veertigtal vragen over je leven. Swoof vergelijkt je antwoorden met meer dan 100 rassen en stelt de rassen voor die het best bij je passen, en ook asielen in je buurt.</p><h3>Wie zit er achter Swoof?</h3><p>Swoof is ontstaan uit mijn eigen ervaring. Toen ik besloot een hond in huis te nemen, ging mijn hart uit naar een corgi: mijn favoriete ras. Maar bij nader inzien had hij me niet kunnen volgen op mijn avonturen, zeker niet met het vliegtuig. Na veel opzoekwerk kwam één ras naar voren dat echt bij mijn leven paste: de teckel. En ik heb nooit spijt gehad van die keuze! 🐾</p><p>Die aanpak wil Swoof voor iedereen toegankelijk maken.</p><p><em>Julie, oprichtster van Swoof</em></p><h3>Een app in testfase</h3><p>Swoof groeit dankzij jouw feedback. Laat ons gerust weten wat je ervan vindt aan het einde van de quiz.</p><h3>Contact</h3><p><a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a></p>",

const LEGAL = {"fr": {"mentions": "<h2 id=\"legal-title\">Mentions légales</h2><p><strong>Éditrice de l'application :</strong> Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, Belgique.</p><p><strong>Numéro d'entreprise (BCE) :</strong> BE 0700.811.142.</p><p><strong>Contact :</strong> <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a></p><p><strong>Hébergement :</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis.</p><p>Swoof est actuellement en phase de test.</p>", "privacy": "<h2 id=\"legal-title\">Politique de confidentialité</h2>\n<h3>Responsable du traitement</h3><p>Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, Belgique (BCE BE 0700.811.142). Contact : <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a>.</p>\n<h3>Données collectées</h3><p>Prénom, adresse e-mail, langue, pays, code postal, ton choix concernant la newsletter, tes réponses au quiz et tes avis (note et commentaire), si tu choisis de les renseigner.</p>\n<h3>Pourquoi ?</h3><p>Personnaliser ton expérience, te donner les bonnes informations pour adopter selon ton lieu de vie, te proposer les refuges les plus proches, améliorer l'app grâce à tes avis et, uniquement si tu l'as accepté, t'envoyer les nouveautés de Swoof.</p>\n<h3>Base légale</h3><p>Ton consentement, donné en cochant la case prévue lors de l'inscription. Tu peux le retirer à tout moment.</p>\n<h3>Durée de conservation</h3><p>Tes données sont conservées au maximum 3 ans après ta dernière utilisation de l'app. L'inscription à la newsletter est conservée jusqu'à ta désinscription.</p>\n<h3>Où sont-elles stockées et qui y a accès ?</h3><p>Tes informations sont enregistrées sur ton téléphone. Tes données d'inscription et tes avis sont aussi transmis dans un tableau Google Sheets accessible uniquement à l'équipe Swoof. Google (Google LLC) agit comme sous-traitant ; ce transfert de données hors de l'Union européenne est encadré par le cadre de protection des données UE–États-Unis (Data Privacy Framework). Tes données ne sont ni vendues ni partagées avec des tiers.</p>\n<h3>Tes droits</h3><p>Tu as le droit d'accéder à tes données, de les faire rectifier ou effacer, de t'opposer à leur traitement, d'en demander la portabilité et de retirer ton consentement à tout moment. Le bouton « Effacer mes données » de l'accueil efface les données de ton téléphone et nous envoie automatiquement ta demande de suppression. Tu peux aussi nous écrire à <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a> : nous répondons dans un délai d'un mois.</p>\n<h3>Réclamation</h3><p>Tu peux introduire une plainte auprès de l'Autorité de protection des données (Belgique, autoriteprotectiondonnees.be) ou de la CNIL (France, cnil.fr).</p>\n<h3>Âge minimum</h3><p>Swoof est destiné aux personnes de 16 ans et plus.</p>\n<h3>Cookies et stockage</h3><p>Swoof n'utilise pas de cookies publicitaires. Les informations enregistrées sur ton téléphone servent uniquement au fonctionnement de l'app.</p>", "terms": "<h2 id=\"legal-title\">Conditions d'utilisation</h2><p>Swoof est un outil gratuit d'aide à la réflexion avant l'adoption d'un chien. Les résultats sont indicatifs : ils ne remplacent pas l'avis d'un vétérinaire, d'un éducateur canin ou d'un refuge.</p><p>Chaque chien est unique : son caractère dépend aussi de son éducation, de sa socialisation et de son histoire.</p><p>Les informations légales (permis, identification, voyages) sont données à titre indicatif et peuvent évoluer : vérifie-les toujours auprès des autorités compétentes.</p><p>Swoof est en phase de test et peut contenir des erreurs. Merci de nous les signaler !</p>"}, "en": {"mentions": "<h2 id=\"legal-title\">Legal notice</h2><p><strong>Publisher:</strong> Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, Belgium.</p><p><strong>Company number (BCE):</strong> BE 0700.811.142.</p><p><strong>Contact:</strong> <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a></p><p><strong>Hosting:</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA.</p><p>Swoof is currently in its test phase.</p>", "privacy": "<h2 id=\"legal-title\">Privacy policy</h2>\n<h3>Data controller</h3><p>Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, Belgium (BCE BE 0700.811.142). Contact: <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a>.</p>\n<h3>Data collected</h3><p>First name, email address, language, country, postcode, your newsletter choice, your quiz answers and your feedback (rating and comment), if you choose to provide them.</p>\n<h3>Why?</h3><p>To personalise your experience, give you the right adoption info for where you live, suggest the closest shelters, improve the app with your feedback and, only if you agreed, send you Swoof news.</p>\n<h3>Legal basis</h3><p>Your consent, given by ticking the box when signing up. You can withdraw it at any time.</p>\n<h3>Retention</h3><p>Your data is kept for up to 3 years after your last use of the app. Newsletter subscriptions are kept until you unsubscribe.</p>\n<h3>Where is it stored and who can access it?</h3><p>Your details are stored on your phone. Your sign-up details and feedback are also sent to a Google Sheets spreadsheet that only the Swoof team can access. Google (Google LLC) acts as a processor; this transfer of data outside the European Union is covered by the EU–US Data Privacy Framework. Your data is never sold or shared with third parties.</p>\n<h3>Your rights</h3><p>You have the right to access, correct or delete your data, to object to its processing, to request its portability and to withdraw your consent at any time. The \"Delete my data\" button on the home screen deletes the data on your phone and automatically sends us your deletion request. You can also email us at <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a>: we reply within one month.</p>\n<h3>Complaints</h3><p>You can lodge a complaint with the Data Protection Authority (Belgium, dataprotectionauthority.be) or the CNIL (France, cnil.fr).</p>\n<h3>Minimum age</h3><p>Swoof is intended for people aged 16 and over.</p>\n<h3>Cookies and storage</h3><p>Swoof does not use advertising cookies. The information stored on your phone is only used for the app to work.</p>", "terms": "<h2 id=\"legal-title\">Terms of use</h2><p>Swoof is a free tool to help you think before adopting a dog. Results are indicative: they don't replace advice from a vet, a dog trainer or a shelter.</p><p>Every dog is unique: its temperament also depends on its training, socialisation and history.</p><p>Legal information (permits, identification, travel) is given for guidance only and may change: always check with the relevant authorities.</p><p>Swoof is in its test phase and may contain errors. Please let us know!</p>"}, "nl": {"mentions": "<h2 id=\"legal-title\">Wettelijke vermeldingen</h2><p><strong>Uitgever:</strong> Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, België.</p><p><strong>Ondernemingsnummer (KBO):</strong> BE 0700.811.142.</p><p><strong>Contact:</strong> <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a></p><p><strong>Hosting:</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, VS.</p><p>Swoof is momenteel in testfase.</p>", "privacy": "<h2 id=\"legal-title\">Privacybeleid</h2>\n<h3>Verwerkingsverantwoordelijke</h3><p>Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, België (KBO BE 0700.811.142). Contact: <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a>.</p>\n<h3>Verzamelde gegevens</h3><p>Voornaam, e-mailadres, taal, land, postcode, je keuze voor de nieuwsbrief, je antwoorden op de quiz en je feedback (score en commentaar), als je ervoor kiest ze in te vullen.</p>\n<h3>Waarom?</h3><p>Om je ervaring te personaliseren, je de juiste info te geven om te adopteren waar je woont, de dichtstbijzijnde asielen voor te stellen, de app te verbeteren dankzij je feedback en, enkel als je ermee akkoord ging, je het nieuws van Swoof te sturen.</p>\n<h3>Rechtsgrond</h3><p>Je toestemming, gegeven door het vakje aan te vinken bij de inschrijving. Je kan ze op elk moment intrekken.</p>\n<h3>Bewaartermijn</h3><p>Je gegevens worden maximaal 3 jaar na je laatste gebruik van de app bewaard. Inschrijvingen voor de nieuwsbrief worden bewaard tot je je uitschrijft.</p>\n<h3>Waar worden ze bewaard en wie heeft toegang?</h3><p>Je gegevens worden op je telefoon bewaard. Je inschrijvingsgegevens en feedback worden ook doorgestuurd naar een Google Sheets-tabel waar enkel het Swoof-team toegang toe heeft. Google (Google LLC) treedt op als verwerker; deze doorgifte buiten de Europese Unie valt onder het EU-VS-kader voor gegevensbescherming (Data Privacy Framework). Je gegevens worden nooit verkocht of gedeeld met derden.</p>\n<h3>Je rechten</h3><p>Je hebt het recht om je gegevens in te kijken, te laten verbeteren of wissen, je te verzetten tegen de verwerking, de overdraagbaarheid te vragen en je toestemming op elk moment in te trekken. De knop « Mijn gegevens wissen » op het startscherm wist de gegevens op je telefoon en stuurt ons automatisch je verzoek tot verwijdering. Je kan ons ook mailen op <a href=\"mailto:swoof.app@gmail.com\">swoof.app@gmail.com</a>: we antwoorden binnen een maand.</p>\n<h3>Klachten</h3><p>Je kan een klacht indienen bij de Gegevensbeschermingsautoriteit (België, gegevensbeschermingsautoriteit.be) of bij de CNIL (Frankrijk, cnil.fr).</p>\n<h3>Minimumleeftijd</h3><p>Swoof is bedoeld voor personen van 16 jaar en ouder.</p>\n<h3>Cookies en opslag</h3><p>Swoof gebruikt geen advertentiecookies. De gegevens op je telefoon dienen enkel om de app te laten werken.</p>", "terms": "<h2 id=\"legal-title\">Gebruiksvoorwaarden</h2><p>Swoof is een gratis hulpmiddel om na te denken voor je een hond adopteert. De resultaten zijn indicatief: ze vervangen het advies van een dierenarts, hondentrainer o const COAT_RULE = {why:tr('le poil que tu aimes','the coat you like',"de vacht die je mooi vindt"),warn:tr('pas le poil que tu préfères','not your preferred coat',"niet je favoriete vacht")};
const COAT_FIT = {C:{C:1,D:.7,M:.4,B:.2,L:0},D:{D:1,C:.5,M:.4,B:.3,L:.1},L:{L:1,B:.8,M:.6,D:.2,C:0}};
const life = b => { const n=b.v.split('–').map(Number); return (n[0]+n[1])/2; };
function fit(b,r){
  switch(r.t){
    case 'min': { const x=b[r.f]; return x>=r.v?1:Math.max(0,1-(r.v-x)/2); }
    case 'max': { const x=b[r.f]; return x<=r.v?1:Math.max(0,1-(x-r.v)/2); }
    case 'sizeMax': { const d=SIZES.indexOf(b.g)-SIZES.indexOf(r.v); return d<=0?1:Math.max(0,1-d/2); }
    case 'sizeMin': { const d=SIZES.indexOf(r.v)-SIZES.indexOf(b.g); return d<=0?1:Math.max(0,1-d/2); }
    case 'first': return b.pc==='Oui'?1:b.pc==='Moyen'?.5:0;
    case 'vol': return b.vo==='Cabine'?1:b.vo==='Cabine selon le poids'?.7:.2;
    case 'coat': return Math.max(...r.set.map(c=>COAT_FIT[c][b.pl]??.5));
  }
  return 1;
}
/* Départage : quand deux races sont aussi compatibles, celle qui dépasse le plus nettement tes critères passe devant */
function margin(b,r){
  switch(r.t){
    case 'min': return (b[r.f]-r.v)/4;
    case 'max': return (r.v-b[r.f])/4;
    case 'sizeMax': return (SIZES.indexOf(r.v)-SIZES.indexOf(b.g))/4;
    case 'sizeMin': return (SIZES.indexOf(b.g)-SIZES.indexOf(r.v))/4;
  }
  return 0;
}
function compute(answers){
  const rules=[], flags={}, coats=[];
  QUESTIONS.forEach(q=>{ if(!(q.id in answers)) return; const a=answers[q.id]; if(a===null) return;
    if(a&&q.flag) [].concat(q.flag).forEach(f=>flags[f]=true);
    if(a===false&&q.flagNo) flags[q.flagNo]=true;
    if(a&&q.coat) coats.push(q.coat);
    (a?(q.yes||[]):(q.no||[])).forEach(r=>rules.push(r)); });
  if(coats.length) rules.push(Object.assign({t:'coat',set:coats,w:2},COAT_RULE));
  const elims=rules.filter(r=>r.t==='elim'||r.t==='elimIn');
  const scored=rules.filter(r=>r.t!=='elim'&&r.t!=='elimIn');
  const max=scored.reduce((s,r)=>s+r.w,0)||1;
  const uniq=arr=>{ const seen=new Set(), out=[]; arr.sort((a,b)=>b[0]-a[0]).forEach(x=>{ if(!seen.has(x[1].fr)){ seen.add(x[1].fr); out.push(x[1]); } }); return out; };
  const all=BREEDS.map(b=>{ let s=0,m=0,pros=[],cons=[],gaps=[];
    scored.forEach(r=>{ const f=fit(b,r); s+=f*r.w; m+=margin(b,r)*r.w; if(f===1&&r.w>=2) pros.push([r.w,r.why]); if(f<.5) cons.push([r.w,r.warn]); if(f<1) gaps.push([r.w*(1-f),r.warn]); });
    const ex=elims.filter(r=> r.t==='elim' ? b[r.f]>r.v : r.vals.includes(b[r.f])).map(r=> r.ex==='plane' ? 'plane_'+({'Nez plat':'flat','Restreint':'restr','Soute':'heavy'})[b.vo] : r.ex);
    return {b,score:s/max+0.03*m/max,pct:Math.round(s/max*100),pros:uniq(pros).slice(0,3),cons:uniq(cons).slice(0,2),gaps:uniq(gaps).slice(0,4),ex};
  });
  const pool=all.filter(x=>!x.ex.length).sort((a,b)=>b.score-a.score || a.b.n.fr.localeCompare(b.b.n.fr));
  pool.forEach((x,i)=>x.rank=i+1);
  return {top:pool.slice(0,4),more:pool.slice(4,10),flags,all,total:pool.length};
}

const visible = q => !q.show || q.show(answers);
function nextIndex(from){ for(let i=from;i<QUESTIONS.length;i++){ if(visible(QUESTIONS[i])) return i; } return -1; }
const totalVisible = () => QUESTIONS.filter(visible).length;
function start(){ answers={}; path=[]; idx=nextIndex(0); show('quiz'); render(); track('quiz_debut'); }
function render(){
  const q=QUESTIONS[idx], done=path.length, total=totalVisible(), pct=Math.round(done/total*100);
  $('#bar').style.width=pct+'%'; $('.progress').setAttribute('aria-valuenow',pct);
  $('#theme').textContent=I18N[LANG].th[q.th]; $('#count').textContent=`${done+1} / ${total}`;
  $('#back').disabled=!path.length; $('#hint1').textContent = path.length ? '' : T('hint');
  const stage=$('#stage'); stage.innerHTML='';
  if(nextIndex(idx+1)>=0){ const b=document.createElement('div'); b.className='card behind'; b.setAttribute('aria-hidden','true'); stage.appendChild(b); }
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="stamp yes">${T('sYes')}</span><span class="stamp no">${T('sNo')}</span><div class="illu" aria-hidden="true">${ILLU[q.id]||''}</div><div class="q-box"><h2 class="q" id="qtext">${L(q.q)}</h2></div>`;
  c.setAttribute('role','group'); c.setAttribute('aria-labelledby','qtext');
  stage.appendChild(c); fitQ(c); drag(c);
}
function fitQ(c){ const box=c.querySelector('.q-box'), h=c.querySelector('.q'); let s=parseFloat(getComputedStyle(h).fontSize); while(h.scrollHeight>box.clientHeight+1 && s>14){ s-=1; h.style.fontSize=s+'px'; } }
function answer(val, card){
  const q=QUESTIONS[idx];
  const go=()=>{ answers[q.id]=val; path.push(idx); const n=nextIndex(idx+1); if(n<0) finish(); else { idx=n; render(); } };
  if(card && val!==null && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    card.style.transition='transform .28s ease, opacity .28s ease';
    card.style.transform=`translateX(${val?520:-520}px) rotate(${val?22:-22}deg)`; card.style.opacity='0';
    setTimeout(go,220);
  } else go();
}
function drag(card){
  let x0=null,dx=0; const y=card.querySelector('.stamp.yes'), n=card.querySelector('.stamp.no');
  card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none';});
  card.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; y.style.opacity=Math.max(0,Math.min(1,dx/90)); n.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  const end=()=>{ if(x0===null) return; x0=null; if(Math.abs(dx)>90) answer(dx>0,card); else { card.style.transition='transform .25s ease'; card.style.transform=''; y.style.opacity=0; n.style.opacity=0; } };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
function back(){ if(!path.length) return; idx=path.pop(); delete answers[QUESTIONS[idx].id]; QUESTIONS.forEach(q=>{ if(!visible(q)) delete answers[q.id]; }); render(); }
function finish(){
  history.unshift({date:Date.now(), answers:{...answers}}); history=history.slice(0,10); store.set('swoof-history',history);
  track('quiz_termine'); openResults(answers);
}

function region(){
  const c=profile&&profile.country, z=parseInt((profile&&profile.zip)||'',10);
  if(c==='FR') return 'fr';
  if(c==='BE'){ if(isNaN(z)) return 'be'; if(z>=1000&&z<=1299) return 'bru'; if((z>=1300&&z<=1499)||(z>=4000&&z<=7999)) return 'wal'; if((z>=1500&&z<=3999)||(z>=8000&&z<=9999)) return 'fla'; return 'be'; }
  return profile ? 'other' : 'be';
}
function userLL(){
  if(!profile||!profile.zip) return null; const z=profile.zip.replace(/\s/g,'');
  if(profile.country==='BE'){ const n=parseInt(z,10); if(isNaN(n)) return null; if(GEO.be[n]) return GEO.be[n]; let best=null,d=1e9; for(const k in GEO.be){ const dd=Math.abs(k-n); if(dd<d){d=dd;best=GEO.be[k];} } return best; }
  if(profile.country==='FR'){ let d=z.slice(0,2); if(d==='20') d=(parseInt(z,10)>=20200?'2B':'2A'); return GEO.fr[d]||null; }
  return null;
}
function refRegion(r){ if(r.cc==='FR') return 'fr'; const z=parseInt(r.z,10); if(z>=1000&&z<=1299) return 'bru'; if((z>=1300&&z<=1499)||(z>=4000&&z<=7999)) return 'wal'; return 'fla'; }
function km(a,b){ const R=6371, r=x=>x*Math.PI/180, dl=r(b[0]-a[0]), dn=r(b[1]-a[1]); const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function refugePanel(){
  let body=`<p>${T('refugeP')}</p>`;
  const ll=userLL();
  if(ll){
    const rg=region(), all=REFUGES.map(r=>({r,d:km(ll,r.ll),rg:refRegion(r)})).sort((a,b)=>a.d-b.d);
    const same=all.filter(x=>x.rg===rg || (rg==='be' && x.r.cc==='BE'));
    const two=(same.length>=2?same:all).slice(0,2);
    const near=[...two, all.find(x=>!two.includes(x))].filter(Boolean);
    body+=`<p style="margin-top:10px"><strong>${T('refugeNear')}</strong></p><ul class="ref-list">${near.map(({r,d})=>`<li class="ref-item"><strong>${esc(r.n)}</strong><small>${esc(r.z)} ${esc(r.c)} · ${T('km').replace('{km}',Math.max(1,Math.round(d/5)*5))}</small><div class="ref-links"><a href="tel:${r.t.replace(/[^0-9+]/g,'')}">📞 ${esc(r.t)}</a><a href="https://${esc(r.w)}" target="_blank" rel="noopener">🌐 ${T('site')}</a></div></li>`).join('')}</ul>`;
  } else if(profile && profile.country && !['BE','FR'].includes(profile.country)) body+=`<p class="note">${T('refugeOther')}</p>`;
  else body+=`<p class="note">${T('refugeNoZip')}</p>`;
  return `<div class="panel refuge"><h3>${T('refugeT')}</h3>${body}</div>`;
}

    try{ const svg=svgI(dog(160,150,1.15)).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" '); const im=new Image(); im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); await im.decode(); g.drawImage(im,W-76-400,hy+hh-250,400,250); }catch(e){}
    g.restore();
    g.fillStyle='#fff'; g.textAlign='left'; g.font=FF(600,44); g.fillText(T('storyBest'),132,hy+86);
    g.font=FF(700,90); const ny=wrap(g,L(m.b.n),132,hy+190,620,92,'left',2);
    g.font=FF(700,130); g.textAlign='left'; g.fillText(m.pct+'\u00a0%',132,ny+135);
    const oy=hy+hh+30, cw=(W-152-44)/3;
    view.top.slice(1,4).forEach((o,i)=>{ const x=76+i*(cw+22); g.fillStyle='#FFFDF9'; roundRect(g,x,oy,cw,170,36); g.fill(); g.strokeStyle='#EBDAC6'; g.lineWidth=4; g.stroke();
      g.fillStyle='#2A1E18'; g.font=FF(600,38); const ly=wrap(g,L(o.b.n),x+24,oy+56,cw-40,42,'left',2); g.fillStyle='#B8452D'; g.font=FF(700,50); g.textAlign='left'; g.fillText(o.pct+'\u00a0%',x+24,Math.min(ly+52,oy+150)); });
    const ry=oy+200, rh=190; g.fillStyle='#FFFDF9'; roundRect(g,76,ry,W-152,rh,40); g.fill(); g.setLineDash([14,10]); g.strokeStyle='#E86A4F'; g.lineWidth=4; g.stroke(); g.setLineDash([]);
    g.strokeStyle='#E86A4F'; g.lineWidth=7; g.lineJoin='round'; g.beginPath(); g.moveTo(118,ry+92); g.lineTo(158,ry+58); g.lineTo(198,ry+92); g.stroke(); g.fillStyle='#FCE7DC'; g.fillRect(128,ry+88,60,48); g.strokeRect(128,ry+88,60,48);
    g.fillStyle='#E86A4F'; g.beginPath(); g.moveTo(158,ry+128); g.bezierCurveTo(142,ry+116,140,ry+104,150,ry+100); g.bezierCurveTo(154,ry+98,157,ry+101,158,ry+104); g.bezierCurveTo(159,ry+101,162,ry+98,166,ry+100); g.bezierCurveTo(176,ry+104,174,ry+116,158,ry+128); g.fill();

    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='swoof.png'; document.body.appendChild(a); a.click(); a.remove(); toast(T('saved'));
  }catch(e){ if(e && e.name==='AbortError') return; toast(T('noShare')); }

function wrap(g,text,x,y,max,lh,align,maxLines){ if(align) g.textAlign=align; const words=String(text).split(' '); let line='', lines=[];
  for(const w of words){ const test=line?line+' '+w:w; if(g.measureText(test).width>max && line){ lines.push(line); line=w; } else line=test; } if(line) lines.push(line);
  if(maxLines && lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]+='…'; }
  lines.forEach((l,i)=>g.fillText(l,x,y+i*lh)); return y+(lines.length-1)*lh; }
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitText(g,t,x,y,max){ let s=58; while(g.measureText(t).width>max && s>30){ s-=2; g.font=`600 ${s}px Fredoka, Trebuchet MS, sans-serif`; } g.fillText(t,x,y); }

/* ===== Historique ===== */
function renderHistory(){
  const fmt=new Intl.DateTimeFormat({fr:'fr-BE',en:'en-GB',nl:'nl-BE'}[LANG],{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  $('#hist-list').innerHTML = history.length ? history.map((h,i)=>{ const r=compute(h.answers); return `<div class="hist-row" data-i="${i}"><button class="del" data-del="${i}">🗑️ ${T('delAction')}</button><button class="hist-item" data-h="${i}"><span><strong>${r.top.map(m=>esc(L(m.b.n))).join(', ')}</strong><br><small>${fmt.format(new Date(h.date))}</small></span><span aria-hidden="true">›</span></button></div>`; }).join('') : `<p class="note">${T('histEmpty')}</p>`;
  document.querySelectorAll('.hist-row').forEach(row=>{
    const it=row.querySelector('.hist-item'); let x0=null,dx=0,moved=false;
    it.addEventListener('pointerdown',e=>{ x0=e.clientX; dx=0; moved=false; it.style.transition='none'; });
    it.addEventListener('pointermove',e=>{ if(x0===null) return; dx=Math.min(0,e.clientX-x0); if(dx<-8) moved=true; it.style.transform=`translateX(${Math.max(dx,-110)}px)`; });
    const end=()=>{ if(x0===null) return; x0=null; it.style.transition='transform .2s ease'; it.style.transform= dx<-60 ? 'translateX(-100px)' : ''; };
    it.addEventListener('pointerup',end); it.addEventListener('pointercancel',end);
    it.addEventListener('click',e=>{ if(moved){ e.preventDefault(); return; } if(it.style.transform==='translateX(-100px)'){ it.style.transform=''; return; } openResults(history[+row.dataset.i].answers); });
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.del, removed=history.splice(i,1)[0]; store.set('swoof-history',history); renderHistory(); toast(T('histDel'),()=>{ history.splice(i,0,removed); store.set('swoof-history',history); renderHistory(); }); });
}

/* ===== Fiche race ===== */
function openDetail(b){
  const g=k=>`<div class="gauge"><span>${T('gauge')[k]}</span><span class="dots">${[1,2,3,4,5].map(n=>`<i class="${n<=b[k]?'on':''}"></i>`).join('')}</span></div>`;
  const id=[]; if(b.a>=4) id.push('a'); if(b.k>=4) id.push('k'); if(b.e>=4) id.push('sport'); if(b.e<=2) id.push('calm'); if(b.pc==='Oui') id.push('first'); if(b.c>=4) id.push('c'); if(b.s>=4) id.push('s'); if(b.gd>=4) id.push('gd');
  const ls=[]; if(b.a<=2) ls.push('a'); if(b.s<=2) ls.push('s'); if(b.e>=4) ls.push('e'); if(b.k<=2) ls.push('k'); if(b.pc==='Non') ls.push('first'); if(b.t<=2) ls.push('t'); if(b.to>=4) ls.push('to'); if(b.ab>=4) ls.push('ab');
  const tips=[]; if(b.s<=2) tips.push('s'); if(b.e>=5) tips.push('e'); if(b.ed<=2) tips.push('ed'); if(b.fd>=4) tips.push('fd'); if(b.sf>=4) tips.push('sf'); if(b.to>=4) tips.push('to'); if(b.vo==='Nez plat'||b.ch<=1) tips.push('heat'); if(b.ab>=4) tips.push('ab'); if(b.t<=2) tips.push('t'); if(!tips.length) tips.push('def');
  $('#detail-body').innerHTML=`<div class="d-head"><h2 id="d-title">${esc(L(b.n))}${b.cr?` <span class="cross">${T('cross')}</span>`:''}</h2><p class="d-sub">${T('dOrigin')} : ${T('og')[b.og]} · ${T('fn')[b.fn]}</p></div>
  <div class="chips"><span>${L(SIZE_L[b.g])}</span><span>${b.p} kg</span><span>${b.v} ${T('years')}</span></div>
  <h3>${T('dChar')}</h3><p>${esc(L(b.car))}.</p>
  <h3>${T('dNeeds')}</h3><div class="gauges">${['e','to','s','ed','k','c'].map(g).join('')}</div>
  ${id.length?`<h3>${T('dIdeal')}</h3><ul class="tags good">${id.slice(0,3).map(k=>`<li>${T('ideal')[k]}</li>`).join('')}</ul>`:''}
  ${ls.length?`<h3>${T('dLess')}</h3><ul class="tags warn">${ls.slice(0,3).map(k=>`<li>${T('lessIf')[k]}</li>`).join('')}</ul>`:''}
  <h3>${T('dHealth')}</h3><p>${esc(L(b.vig))}.</p>
  <h3>${T('dTip')}</h3><p class="tip">${T('tips')[tips[0]]}</p>`;
  if(LANG==='fr') $('#detail-body').innerHTML=$('#detail-body').innerHTML.replace(' : ','\u00a0: ');
  $('#detail').classList.remove('hidden'); $('#detail-close').focus();
}
