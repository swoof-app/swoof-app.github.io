<style>:root{--bg:#FFF4E6;--card:#FFFDF9;--ink:#2A1E18;--muted:#6B5549;--line:#EBDAC6;--coral:#E86A4F;--coral-strong:#B8452D;--coral-soft:#FBE1D8;--good:#2F7A45;--good-soft:#DDF0E0;--warn:#9A5A0B;--warn-soft:#FCEBD0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding:16px 18px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hidden{display:none!important}
.screen{display:flex;flex-direction:column;gap:18px;flex:1}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink)}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 0 4px}
.hero .logo-icon{width:96px}.hero .word{font-size:clamp(50px,15vw,64px)}
.slogan{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,5.8vw,26px);margin:6px 0 0}
.tagline{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--coral-strong);margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.topbar .logo-icon{width:44px}.topbar .word{font-size:25px}
.home-btn{background:none;border:0;padding:4px 0;min-height:44px;display:flex;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 4px;min-height:44px;font-size:15px}
.linkbtn:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;text-decoration:none;width:100%}
.btn-primary{background:var(--coral-strong);color:#fff}.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-soft{background:var(--card);border-color:var(--line);color:var(--ink)}
.form,.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px}
.form{display:flex;flex-direction:column;gap:14px}
.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input,.field select,textarea{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px}
textarea{min-height:90px;padding:10px 14px;resize:vertical}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--coral);outline:none}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.help{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.err{color:var(--coral-strong);font-size:14px;font-weight:600;margin:4px 0 0}.err:empty{display:none}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-btn{min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.lang-btn[aria-pressed=true]{border-color:var(--coral-strong);background:var(--coral-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--coral-strong);flex:none}
.small{font-size:13.5px;color:var(--muted);margin:0}
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;margin-top:6px}
.legal-links button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px}
/* Accueil connecté */
.hello{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600;text-align:center;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:12px}
/* Tutoriel */
.tuto-demo{position:relative;height:220px;border-radius:24px;background:#FCE7DC;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tuto-card{width:170px;height:150px;background:var(--card);border:2px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;position:relative;animation:tutoSwipe 4s ease-in-out infinite}
.tuto-card .st{position:absolute;top:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;border:3px solid;border-radius:8px;padding:0 8px;opacity:0}
.tuto-card .st.y{left:10px;color:var(--good);animation:tutoYes 4s infinite}
.tuto-card .st.n{right:10px;color:var(--coral-strong);animation:tutoNo 4s infinite}
.tuto-hand{position:absolute;font-size:40px;bottom:6px;left:50%;animation:tutoHand 4s ease-in-out infinite}
@keyframes tutoSwipe{0%,10%{transform:none}30%,40%{transform:translateX(70px) rotate(10deg)}50%,60%{transform:none}80%,90%{transform:translateX(-70px) rotate(-10deg)}100%{transform:none}}
@keyframes tutoHand{0%,10%{transform:translateX(-50%)}30%,40%{transform:translateX(20px)}50%,60%{transform:translateX(-50%)}80%,90%{transform:translateX(-120px)}100%{transform:translateX(-50%)}}
@keyframes tutoYes{0%,15%{opacity:0}30%,40%{opacity:1}50%,100%{opacity:0}}
@keyframes tutoNo{0%,65%{opacity:0}80%,90%{opacity:1}100%{opacity:0}}
.tuto-legend{display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:15px}
.tuto-legend .y{color:var(--good);text-align:right}.tuto-legend .n{color:var(--coral-strong)}
.note-box{background:var(--coral-soft);border-radius:18px;padding:14px 16px;font-weight:600}
/* Quiz */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--coral);border-radius:99px;transition:width .3s ease}
.theme-label{color:var(--muted);font-weight:600;font-size:15px;margin:0}
.encourage{background:var(--good-soft);color:var(--good);font-weight:700;border-radius:14px;padding:8px 14px;text-align:center;font-size:15px}
.stage{position:relative;flex:1;min-height:360px;display:flex}
.card{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px 22px 26px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;box-shadow:0 18px 40px -24px rgba(42,30,24,.35)}
.card.behind{transform:scale(.95) translateY(14px);opacity:.6;box-shadow:none}
.illu{height:150px;margin:-6px -6px 16px;border-radius:20px;background:#FCE7DC;overflow:hidden}
.illu svg{width:100%;height:100%;display:block}
.card .q{font-family:'Fredoka',sans-serif;font-size:clamp(21px,5.6vw,26px);font-weight:600;line-height:1.22}
.card .hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.stamp{position:absolute;top:24px;padding:4px 14px;border-radius:12px;border:3px solid;font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;opacity:0;pointer-events:none;background:var(--card)}
.stamp.yes{left:20px;color:var(--good);border-color:var(--good);transform:rotate(-10deg)}
.stamp.no{right:20px;color:var(--coral-strong);border-color:var(--coral-strong);transform:rotate(10deg)}
.controls{display:flex;align-items:center;justify-content:center;gap:26px}
.round{width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--card);font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;gap:2px}
.round svg{width:24px;height:24px}
.round.yes{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.under{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.count{font-variant-numeric:tabular-nums}
/* Résultats */
#r-title{font-size:clamp(26px,7vw,32px)}
.lead{color:var(--muted);margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.match.first{border-color:var(--coral)}
.match h2{font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--coral-strong);line-height:1}
.pct small{font-size:12px;font-weight:500;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--coral);border-radius:99px}
.facts{margin:0;font-size:12.5px;line-height:1.35}
.facts div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding:2px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:700;text-align:right}
.car{margin:0;font-size:13px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.tags li{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:700;line-height:1.35}
.tags.good li{background:var(--good-soft);color:var(--good)}.tags.warn li{background:var(--warn-soft);color:var(--warn)}
.vig{font-size:12px;color:var(--muted);margin:0;line-height:1.35}
.cross{display:inline-block;vertical-align:middle;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.panel h3{font-size:20px;margin-bottom:8px}.panel p{margin:0 0 10px}.panel ul{margin:0;padding-left:20px}.panel li{margin-bottom:6px}
.panel.ebook{background:var(--coral-soft);border-color:var(--coral)}
.panel.refuge{border-style:dashed}
.more{display:flex;flex-direction:column;gap:10px}
.mini-match{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.mini-match summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer;min-height:54px}
.mini-match summary::-webkit-details-marker{display:none}
.mm-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;line-height:1.2}
.mm-name small{display:block;font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:var(--muted)}
.mm-pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;color:var(--coral-strong)}
.mm-body{padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.wish select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 12px;margin-bottom:10px}
.stars{display:flex;gap:6px;margin:4px 0 12px}
.stars button{background:none;border:0;font-size:32px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:#F2A93B}
.hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.hist-item small{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(42,30,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:24px;margin-bottom:10px}.sheet h3{font-size:18px;margin:16px 0 6px}.sheet p{margin:0 0 8px;font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.ref-list{list-style:none;padding:0!important;margin:12px 0 0!important;display:flex;flex-direction:column;gap:10px}
.ref-item{background:var(--bg);border-radius:16px;padding:12px 14px}
.ref-item strong{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;line-height:1.25}
.ref-item small{color:var(--muted);display:block;margin:2px 0 8px}
.ref-links{display:flex;gap:8px;flex-wrap:wrap}
.ref-links a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.section-title{font-size:20px;margin:6px 0 -6px}
/* ===== Mise à jour 2 ===== */
p,h1,h2,h3,li,.card .q,.note-box{text-wrap:pretty}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inline-link{background:none;border:0;padding:0;color:var(--coral-strong);font-weight:700;text-decoration:underline;font-size:14px;text-align:left;align-self:flex-start;min-height:32px}
/* Quiz : tout tient sur un écran */
#quiz{min-height:calc(100dvh - 56px);gap:12px}
#quiz .stage{flex:1;min-height:300px}
.card{padding:14px 14px 20px;justify-content:flex-end;gap:12px}
.card .illu{flex:1;height:auto;min-height:120px;margin:0;border-radius:20px}
.card .illu svg{height:100%}
.card .q{margin:0 6px}
.card .hint{margin:-4px 6px 0}
.controls{gap:16px;padding:4px 0}
.round{border:0;box-shadow:0 6px 18px -8px rgba(42,30,24,.45);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;padding:0}
.round.big{width:72px;height:72px}
.round.big svg{width:32px;height:32px}
.round.small{width:54px;height:54px}
.round.small svg{width:24px;height:24px}
.round.no{color:var(--ink);border:2px solid var(--ink)}
.round.yes{color:#fff;background:var(--coral-strong)}
.round.back{color:#E0A100;border:2px solid #F2C94C}
.round.joker{color:#5B6FD6;border:2px solid #AEB9F0;gap:1px}
.round.joker svg{width:20px;height:20px}
.lbl-mini{font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;line-height:1}
.round:disabled{opacity:.35}
.count{text-align:center;color:var(--muted);font-size:14px;margin:0;font-variant-numeric:tabular-nums}
/* Historique : glisser pour supprimer */
.hist-row{position:relative;border-radius:18px;overflow:hidden;background:#C2452F}
.hist-row .del{position:absolute;right:0;top:0;bottom:0;width:100px;border:0;background:#C2452F;color:#fff;font-weight:700;font-size:15px}
.hist-row .hist-item{position:relative;transition:transform .2s ease;touch-action:pan-y}
/* Fiche race */
.match .see{background:none;border:0;padding:6px 0 0;color:var(--coral-strong);font-weight:700;font-size:13px;text-align:left;min-height:32px}
.d-head{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.d-head h2{font-size:26px;margin:0}
.d-sub{color:var(--muted);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.gauges{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.gauge{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:14px}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--coral)}
.tip{background:var(--coral-soft);border-radius:16px;padding:12px 14px;margin:0}
/* Toast avec annulation */
.toast{display:flex;align-items:center;gap:14px}
.toast.show{pointer-events:auto}
#toast-undo{background:none;border:0;color:#F2C94C;font-weight:800;padding:4px 0}

/* cartes ajustées à leur contenu, sans vide */
#quiz{min-height:0}
#quiz .stage{flex:0 0 auto;min-height:0;position:relative}
#quiz .card{position:relative;inset:auto}
#quiz .card.behind{position:absolute;inset:0}
.card .illu{flex:none;aspect-ratio:320/200;width:100%;min-height:0}

.about-pill{align-self:center;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border-radius:99px;border:2px solid var(--coral);background:var(--coral-soft);color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px}
.about-pill:hover{background:#F8D3C6}

.card .illu{aspect-ratio:auto!important;height:0!important;padding-top:62.5%;position:relative;flex:none!important;width:100%}
.card .illu svg{position:absolute;inset:0;width:100%;height:100%}
.hint1{text-align:center;color:var(--muted);font-size:14px;margin:-6px 0 0;min-height:0}
.hint1:empty{display:none}

#quiz .stage{display:block}
#quiz .card{width:100%;box-sizing:border-box}

/* toutes les cartes ont exactement la même taille */
.card .q-box{height:calc(3 * 1.22 * clamp(21px,5.6vw,26px));display:flex;align-items:center;margin:0 6px;overflow:hidden}
.card .q-box .q{margin:0;font-size:clamp(21px,5.6vw,26px);line-height:1.22}

.round{position:relative;overflow:visible}
.under-lbl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;line-height:1}
.round.joker svg{width:24px;height:24px}
.controls{padding-bottom:22px}

.share-tip{margin:0;text-align:center;font-weight:700;color:var(--coral-strong);font-size:15px}
.reg{background:#FFF1E0;border-left:4px solid #E86A4F;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;margin-top:8px;text-wrap:pretty}
.illu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.illu:has(img){background:#FCF3E0}

/* ===== Mise à jour 5 ===== */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#F3E3D2;border-radius:16px;padding:4px}
.seg .lang-btn{border:0;background:transparent;min-height:44px;border-radius:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
.seg .lang-btn[aria-pressed="true"]{background:var(--coral);color:var(--ink);box-shadow:0 2px 6px rgba(184,69,45,.25)}
.big-brand .word{font-size:clamp(44px,13vw,60px)}
.slogan{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;color:var(--ink);text-align:center;margin:4px 0 0}
.slogan.sm{font-size:14px;color:var(--coral-strong)}
.w-cards{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.w-card{display:flex;align-items:center;gap:14px;text-align:left;border-radius:24px;padding:20px 18px 22px 22px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.w-card.w-dog{background:var(--coral);border-color:var(--coral)}
.w-txt{flex:1;display:flex;flex-direction:column;gap:4px}
.w-kicker{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral-strong)}
.w-dog .w-kicker{color:var(--ink)}
.w-sub{font-weight:700;font-size:15px}
.w-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:23px;line-height:1.15}
.w-sub2{font-weight:600;font-size:15px;margin-top:4px}
.w-arrow{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
.w-arrow svg{width:26px;height:26px}
.w-arrow.coral{background:var(--coral);color:var(--ink)}.w-arrow.dark{background:var(--ink);color:#fff}
.w-login{text-align:center;margin:26px 0 0;font-size:16px}
.w-login .inline-link{font-weight:700;color:var(--coral-strong)}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.pg-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:27px;margin:4px 0 0}
.sec-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:21px;margin:12px 0 0}
.topbar-l{display:flex;align-items:center;gap:14px}
.back-sq{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.back-sq svg{width:22px;height:22px}
.topbar-l .brand .word{font-size:28px}
.su-form{display:flex;flex-direction:column;gap:14px}
.su-submit{margin-top:18px}
.with-nav{padding-bottom:96px}
.small-hero{gap:2px}.small-hero .brand .word{font-size:34px}
.dog-row{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 6px}
.dog-pill{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;color:var(--ink);font-weight:700;font-size:14px;min-width:72px}
.avatar{width:66px;height:66px;border-radius:50%;background:#F1DCC8;display:grid;place-items:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:var(--coral-strong);overflow:hidden;border:3px solid transparent}
.avatar img{width:100%;height:100%;object-fit:cover}
.dog-pill.sel .avatar{border-color:var(--coral)}
.avatar.add{background:transparent;border:2px dashed #E3A792;color:var(--coral-strong)}
.dog-pill.addp{color:var(--coral-strong)}
.avatar.big{width:96px;height:96px;font-size:34px;cursor:pointer}
.dog-card{background:var(--coral);border-radius:24px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.dog-card .k{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.dog-card .t{font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px}
.dog-card .btn{margin-top:8px;background:var(--ink);color:#fff;border-color:var(--ink)}
.d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.d-grid .d-tile{min-width:0;padding:14px 9px 14px 11px}
.d-grid .d-tile .d-lbl{font-size:14px;letter-spacing:-.015em}
@media (max-width:360px){.d-grid{gap:8px}.d-grid .d-tile{padding:12px 6px 12px 8px}.d-grid .d-tile .d-lbl{font-size:12px}.d-grid .d-tile .soon{font-size:10px!important;padding:2px 6px!important}}


.d-tile{position:relative;background:#fff;border:0;border-radius:18px;padding:14px 12px;min-height:104px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;font:inherit;text-align:left;color:var(--ink);box-shadow:0 1px 0 rgba(42,30,24,.04)}
.d-tile .d-lbl{font-weight:700;font-size:15px;line-height:1.2}
.d-ico{width:38px;height:38px;border-radius:12px;background:var(--coral-soft);display:grid;place-items:center;color:var(--coral-strong);flex:none}
.d-ico .ic{width:20px;height:20px}
.soon{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:#F3E3D2;color:var(--muted);border-radius:99px;padding:2px 8px}
.stack-s{display:flex;flex-direction:column;gap:12px}
.d-row{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left;min-height:64px}
.d-row .d-lbl{flex:1;font-weight:700;font-size:16px}
.d-row .chev{width:20px;height:20px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.bottom-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:13px;color:var(--ink);min-height:48px}
.bottom-nav .ic{width:24px;height:24px}
.bottom-nav button.on{color:var(--coral-strong);font-weight:700}
.news-form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.news-form input{flex:1;min-width:0;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px}
.news-form .btn{width:100%;padding:0 18px;min-height:52px}
.nw-priv{font-size:12.5px;text-align:center;margin:8px 0 0}
.news-box.done .nw-priv{display:none}
.nw-priv .inline-link{font-size:inherit;display:inline;padding:0;min-height:0;margin:0}
.news-box.done .news-form{display:none}
.photo-pick{display:flex;align-items:center;gap:14px}
.dog-item{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left}
.dog-item .avatar{width:54px;height:54px;font-size:22px}
.dog-item small{display:block;color:var(--muted);font-weight:600}
.info-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.info-list dt{color:var(--muted);font-weight:600}.info-list dd{margin:0;font-weight:700;word-break:break-word}
.carnet-soon{background:var(--card);border:2px dashed #E3A792;border-radius:20px;padding:18px;text-align:center}
.topbar-l .logo-icon{width:44px}
.small-hero .logo-icon{width:70px}
.avatar svg{width:26px;height:26px}
body.has-nav .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.toast{max-width:calc(100% - 32px)}
.soon{position:static;align-self:flex-start;font-size:11px;padding:2px 8px;margin-top:-4px}
.d-tile{justify-content:flex-start}
.dog-item .chev{width:20px;height:20px;flex:none}
.d-row .d-sub{display:block;font-weight:600;font-size:14px;color:var(--coral-strong);margin-top:2px}

/* ===== Carnet de santé ===== */
.todo{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.todo h3{font-size:18px;margin:0 0 8px}
.todo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.todo .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:#E3C7A8}
.todo .late .dot{background:#C2452F}.todo .today .dot{background:var(--coral)}
.todo .late strong{color:#B8452D}
.hs{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hs-head{display:flex;align-items:center;gap:12px}
.hs-head h3{flex:1;font-size:19px;margin:0}
.hs-add{border:0;background:var(--coral-soft);color:var(--coral-strong);font-weight:700;border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}

"aboutT": "À propos de Swouf",
"about": "<p><strong>Notre mission :</strong> aider chacun à trouver le chien fait pour sa vie. Trop de chiens sont abandonnés parce que leur race ne correspondait pas au mode de vie de leur famille. Swouf t'aide à écouter ton cœur, mais aussi ton quotidien.</p><h3>Comment ça marche ?</h3><p>Tu réponds par oui ou non à une quarantaine de questions sur ta vie. Swouf compare tes réponses avec plus de 100 races et te propose celles qui te correspondent le mieux, ainsi que les refuges proches de chez toi.</p><h3>Qui se cache derrière Swouf ?</h3><p>Swouf est né de ma propre expérience. Quand j'ai décidé d'accueillir un chien, mon cœur penchait pour un corgi : c'était ma race coup de cœur. Mais en y regardant de plus près, il n'aurait pas pu me suivre dans mes aventures, notamment en avion. Après beaucoup de recherches, une race est ressortie comme celle qui correspondait vraiment à ma vie : le teckel. Et je n'ai jamais regretté ce choix ! 🐾</p><p>C'est cette démarche que Swouf veut rendre accessible à tous.</p><p><em>Julie, fondatrice de Swouf</em></p><h3>Une app en phase de test</h3><p>Swouf grandit grâce à tes avis. N'hésite pas à nous dire ce que tu en penses à la fin du quiz.</p><h3>Nous contacter</h3><p><a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a></p>",

"aboutT": "About Swouf",
"about": "<p><strong>Our mission:</strong> help everyone find the dog made for their life. Too many dogs are abandoned because their breed didn't suit their family's lifestyle. Swouf helps you listen to your heart, but also to your daily life.</p><h3>How does it work?</h3><p>You answer yes or no to about forty questions about your life. Swouf compares your answers with more than 100 breeds and suggests the ones that suit you best, as well as shelters near you.</p><h3>Who's behind Swouf?</h3><p>Swouf was born from my own experience. When I decided to welcome a dog, my heart was set on a corgi: it was my favourite breed. But looking more closely, it couldn't have followed me on my adventures, especially by plane. After a lot of research, one breed stood out as the one that truly suited my life: the dachshund. And I've never regretted that choice! 🐾</p><p>That's the approach Swouf wants to make accessible to everyone.</p><p><em>Julie, founder of Swouf</em></p><h3>An app in its test phase</h3><p>Swouf grows thanks to your feedback. Feel free to tell us what you think at the end of the quiz.</p><h3>Contact us</h3><p><a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a></p>",

"aboutT": "Over Swouf",
"about": "<p><strong>Onze missie:</strong> iedereen helpen de hond te vinden die bij zijn leven past. Te veel honden worden afgestaan omdat hun ras niet bij de levensstijl van hun gezin paste. Swouf helpt je te luisteren naar je hart, maar ook naar je dagelijks leven.</p><h3>Hoe werkt het?</h3><p>Je antwoordt ja of nee op een veertigtal vragen over je leven. Swouf vergelijkt je antwoorden met meer dan 100 rassen en stelt de rassen voor die het best bij je passen, en ook asielen in je buurt.</p><h3>Wie zit er achter Swouf?</h3><p>Swouf is ontstaan uit mijn eigen ervaring. Toen ik besloot een hond in huis te nemen, ging mijn hart uit naar een corgi: mijn favoriete ras. Maar bij nader inzien had hij me niet kunnen volgen op mijn avonturen, zeker niet met het vliegtuig. Na veel opzoekwerk kwam één ras naar voren dat echt bij mijn leven paste: de teckel. En ik heb nooit spijt gehad van die keuze! 🐾</p><p>Die aanpak wil Swouf voor iedereen toegankelijk maken.</p><p><em>Julie, oprichtster van Swouf</em></p><h3>Een app in testfase</h3><p>Swouf groeit dankzij jouw feedback. Laat ons gerust weten wat je ervan vindt aan het einde van de quiz.</p><h3>Contact</h3><p><a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a></p>",

s ?</h3><p>Tes informations sont enregistrées sur ton téléphone. Tes informations du test, ton inscription, ton adresse e-mail pour les nouvelles et tes avis sont aussi transmis dans un tableau Google Sheets accessible uniquement à l'équipe Swouf. Google (Google LLC) agit comme sous-traitant ; ce transfert de données hors de l'Union européenne est encadré par le cadre de protection des données UE–États-Unis (Data Privacy Framework). Tes données ne sont ni vendues ni partagées avec des tiers.</p>\n<h3>Tes droits</h3><p>Tu as le droit d'accéder à tes données, de les faire rectifier ou effacer, de t'opposer à leur traitement, d'en demander la portabilité et de retirer ton consentement à tout moment. Le bouton « Effacer mes données » de ton profil efface les données de ton téléphone et nous envoie automatiquement ta demande de suppression. Tu peux aussi nous écrire à <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a> : nous répondons dans un délai d'un mois.</p>\n<h3>Réclamation</h3><p>Tu peux introduire une plainte auprès de l'Autorité de protection des données (Belgique, autoriteprotectiondonnees.be) ou de la CNIL (France, cnil.fr).</p>\n<h3>Âge minimum</h3><p>Swouf est destiné aux personnes de 16 ans et plus.</p>\n<h3>Cookies et stockage</h3><p>Swouf n'utilise pas de cookies publicitaires. Les informations enregistrées sur ton téléphone servent uniquement au fonctionnement de l'app.</p>", "terms": "<h2 id=\"legal-title\">Conditions d'utilisation</h2><p>Swouf est un outil gratuit d'aide à la réflexion avant l'adoption d'un chien. Les résultats sont indicatifs : ils ne remplacent pas l'avis d'un vétérinaire, d'un éducateur canin ou d'un refuge.</p><p>Chaque chien est unique : son caractère dépend aussi de son éducation, de sa socialisation et de son histoire.</p><p>Les informations légales (permis, identification, voyages) sont données à titre indicatif et peuvent évoluer : vérifie-les toujours auprès des autorités compétentes.</p><p>Swouf est en phase de test et peut contenir des erreurs. Merci de nous les signaler !</p>"}, "en": {"mentions": "<h2 id=\"legal-title\">Legal notice</h2><p><strong>Publisher:</strong> Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, Belgium.</p><p><strong>Company number (BCE):</strong> BE 0700.811.142.</p><p><strong>Contact:</strong> <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a></p><p><strong>Hosting:</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA.</p><p>Swouf is currently in its test phase.</p>", "privacy": "<h2 id=\"legal-title\">Privacy policy</h2>\n<h3>Data controller</h3><p>Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, Belgium (BCE BE 0700.811.142). Contact: <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a>.</p>\n<h3>Data collected</h3><p>For the test: your first name, country, postcode, language, quiz answers and the breeds you got. If you wish: your email address to receive Swouf news, and your feedback (rating and comment). If you create an account: first name, email address, language, country, postcode, your newsletter choice, and your dog's profile (name, breed, date of birth, sex, photo).</p>\n<h3>Why?</h3><p>To personalise your experience, give you the right adoption info for where you live, suggest the closest shelters, improve the app with your feedback and, only if you agreed, send you Swouf news.</p>\n<h3>Legal basis</h3><p>Your consent: by continuing before your result, by signing up for Swouf news or by ticking the box when creating your account. You can withdraw it at any time.</p>\n<h3>Retention</h3><p>Your data is kept for up to 3 years after your last use of the app. Newsletter subscriptions are kept until you unsubscribe.</p>\n<h3>Where is it stored and who can access it?</h3><p>Your details are stored on your phone. Your test details, sign-up details, news email address and feedback are also sent to a Google Sheets spreadsheet that only the Swouf team can access. Google (Google LLC) acts as a processor; this transfer of data outside the European Union is covered by the EU–US Data Privacy Framework. Your data is never sold or shared with third parties.</p>\n<h3>Your rights</h3><p>You have the right to access, correct or delete your data, to object to its processing, to request its portability and to withdraw your consent at any time. The \"Delete my data\" button in your profile deletes the data on your phone and automatically sends us your deletion request. You can also email us at <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a>: we reply within one month.</p>\n<h3>Complaints</h3><p>You can lodge a complaint with the Data Protection Authority (Belgium, dataprotectionauthority.be) or the CNIL (France, cnil.fr).</p>\n<h3>Minimum age</h3><p>Swouf is intended for people aged 16 and over.</p>\n<h3>Cookies and storage</h3><p>Swouf does not use advertising cookies. The information stored on your phone is only used for the app to work.</p>", "terms": "<h2 id=\"legal-title\">Terms of use</h2><p>Swouf is a free tool to help you think before adopting a dog. Results are indicative: they don't replace advice from a vet, a dog trainer or a shelter.</p><p>Every dog is unique: its temperament also depends on its training, socialisation and history.</p><p>Legal information (permits, identification, travel) is given for guidance only and may change: always check with the relevant authorities.</p><p>Swouf is in its test phase and may contain errors. Please let us know!</p>"}, "nl": {"mentions": "<h2 id=\"legal-title\">Wettelijke vermeldingen</h2><p><strong>Uitgever:</strong> Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, België.</p><p><strong>Ondernemingsnummer (KBO):</strong> BE 0700.811.142.</p><p><strong>Contact:</strong> <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a></p><p><strong>Hosting:</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, VS.</p><p>Swouf is momenteel in testfase.</p>", "privacy": "<h2 id=\"legal-title\">Privacybeleid</h2>\n<h3>Verwerkingsverantwoordelijke</h3><p>Julie Vankerckhoven, avenue des Champs Clairs 24, 1421 Ophain, België (KBO BE 0700.811.142). Contact: <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a>.</p>\n<h3>Verzamelde gegevens</h3><p>Voor de test: je voornaam, land, postcode, taal, je antwoorden op de quiz en de rassen die je kreeg. Als je dat wilt: je e-mailadres om het nieuws van Swouf te ontvangen, en je feedback (score en commentaar). Als je een account aanmaakt: voornaam, e-mailadres, taal, land, postcode, je keuze voor de nieuwsbrief en de fiche van je hond (naam, ras, geboortedatum, geslacht, foto).</p>\n<h3>Waarom?</h3><p>Om je ervaring te personaliseren, je de juiste info te geven om te adopteren waar je woont, de dichtstbijzijnde asielen voor te stellen, de app te verbeteren dankzij je feedback en, enkel als je ermee akkoord ging, je het nieuws van Swouf te sturen.</p>\n<h3>Rechtsgrond</h3><p>Je toestemming: door verder te gaan voor je resultaat, door je in te schrijven voor het nieuws van Swouf of door het vakje aan te vinken bij het aanmaken van je account. Je kan ze op elk moment intrekken.</p>\n<h3>Bewaartermijn</h3><p>Je gegevens worden maximaal 3 jaar na je laatste gebruik van de app bewaard. Inschrijvingen voor de nieuwsbrief worden bewaard tot je je uitschrijft.</p>\n<h3>Waar worden ze bewaard en wie heeft toegang?</h3><p>Je gegevens worden op je telefoon bewaard. Je testgegevens, inschrijvingsgegevens, e-mailadres voor het nieuws en feedback worden ook doorgestuurd naar een Google Sheets-tabel waar enkel het Swouf-team toegang toe heeft. Google (Google LLC) treedt op als verwerker; deze doorgifte buiten de Europese Unie valt onder het EU-VS-kader voor gegevensbescherming (Data Privacy Framework). Je gegevens worden nooit verkocht of gedeeld met derden.</p>\n<h3>Je rechten</h3><p>Je hebt het recht om je gegevens in te kijken, te laten verbeteren of wissen, je te verzetten tegen de verwerking, de overdraagbaarheid te vragen en je toestemming op elk moment in te trekken. De knop « Mijn gegevens wissen » in je profiel wist de gegevens op je telefoon en stuurt ons automatisch je verzoek tot verwijdering. Je kan ons ook mailen op <a href=\"mailto:swouf.app@gmail.com\">swouf.app@gmail.com</a>: we antwoorden binnen een maand.</p>\n<h3>Klachten</h3><p>Je kan een klacht indienen bij de Gegevensbeschermingsautoriteit (België, gegevensbeschermingsautoriteit.be) of bij de CNIL (Frankrijk, cnil.fr).</p>\n<h3>Minimumleeftijd</h3><p>Swouf is bedoeld voor personen van 16 jaar en ouder.</p>\n<h3>Cookies en opslag</h3><p>Swouf gebruikt geen advertentiecookies. De gegevens op je telefoon dienen enkel om de app te laten werken.</p>", "terms": "<h2 id=\"legal-title\">Gebruiksvoorwaarden</h2><p>Swouf is een gratis hulpmiddel om na te denken voor je een hond adopteert. De resultaten zijn indicatief: ze vervangen het advies van een dierenarts, hondentrainer of asiel niet.</p><p>Elke hond is uniek: zijn karakter hangt ook af van zijn opvoeding, socialisatie en voorgeschiedenis.</p><p>Wettelijke informatie (vergunningen, identificatie, reizen) wordt ter indicatie gegeven en kan veranderen: controleer ze altijd bij de bevoegde instanties.</p><p>Swouf is in testfase en kan fouten bevatten. Laat het ons weten!</p>"}};

const COAT_RULE = {why:tr('le poil que tu aimes','the coat you like',"de vacht die je mooi vindt"),warn:tr('pas le poil que tu préfères','not your preferred coat',"niet je favoriete vacht")};
const COAT_FIT = {C:{C:1,D:.7,M:.4,B:.2,L:0},D:{D:1,C:.5,M:.4,B:.3,L:.1},L:{L:1,B:.8,M:.6,D:.2,C:0}};
const life = b => { const n=b.v.split('–').map(Number); return (n[0]+n[1])/2; };
function fit(b,r){
  switch(r.t){
    case 'min': { const x=b[r.f]; return x>=r.v?1:Math.max(0,1-(r.v-x)/2); }
    case 'max': { const x=b[r.f]; return x<=r.v?1:Math.max(0,1-(x-r.v)/2); }
    case 'sizeMax': { const d=sizeIdx(b.g,'min')-SIZES.indexOf(r.v); return d<=0?1:Math.max(0,1-d/2); }
    case 'sizeMin': { const d=SIZES.indexOf(r.v)-sizeIdx(b.g,'max'); return d<=0?1:Math.max(0,1-d/2); }
    case 'first': return b.pc==='Oui'?1:b.pc==='Moyen'?.5:0;
    case 'vol': return b.vo==='Cabine'?1:b.vo==='Cabine selon le poids'?.7:.2;
    case 'coat': return Math.max(...r.set.map(c=>COAT_FIT[c][b.pl]??.5));
  }
  return 1;
}
/* Départage : quand deux races sont aussi compatibles, celle qui dépasse le plus nettement tes critères passe devant */
function margin(b,r){
  switch(r.t){
    case 'min': return (b[r.f]-r.v)/4;
    case 'max': return (r.v-b[r.f])/4;
    case 'sizeMax': return (SIZES.indexOf(r.v)-sizeIdx(b.g,'min'))/4;
    case 'sizeMin': return (sizeIdx(b.g,'max')-SIZES.indexOf(r.v))/4;
  }
  return 0;
}
function compute(answers){
  const rules=[], flags={}, coats=[];
  const anySize = answers[124]===true && answers[125]===true;
  QUESTIONS.forEach(q=>{ if(!(q.id in answers)) return; const a=answers[q.id]; if(a===null) return;
    if(anySize && [124,125,40].includes(q.id)) return;
    if(a&&q.flag) [].concat(q.flag).forEach(f=>flags[f]=true);
    if(a===false&&q.flagNo) flags[q.flagNo]=true;
    if(a&&q.coat) coats.push(q.coat);
    (a?(q.yes||[]):(q.no||[])).forEach(r=>rules.push(r)); });
  if(coats.length) rules.push(Object.assign({t:'coat',set:coats,w:2},COAT_RULE));
  /* Taille souhaitée = filtre strict (124 petit/moyen, 125 moyen/grand, 40 porter) */
  const wS=answers[124]===true, wL=answers[125]===true;
  const sizeOK = wS&&!wL ? (answers[40]===true ? ['Très petit','Petit'] : ['Très petit','Petit','Moyen'])
               : wL&&!wS ? ['Moyen','Grand','Géant'] : null;
  const elims=rules.filter(r=>r.t==='elim'||r.t==='elimIn');
  const scored=rules.filter(r=>r.t!=='elim'&&r.t!=='elimIn');
  const max=scored.reduce((s,r)=>s+r.w,0)||1;
  const uniq=arr=>{ const seen=new Set(), out=[]; arr.sort((a,b)=>b[0]-a[0]).forEach(x=>{ if(!seen.has(x[1].fr)){ seen.add(x[1].fr); out.push(x[1]); } }); return out; };
  const all=BREEDS.map(b=>{ let s=0,m=0,pros=[],cons=[],gaps=[];
    scored.forEach(r=>{ const f=fit(b,r); s+=f*r.w; m+=margin(b,r)*r.w; if(f===1&&r.w>=2) pros.push([r.w,r.why]); if(f<.5) cons.push([r.w,r.warn]); if(f<1) gaps.push([r.w*(1-f),r.warn]); });
    const ex=elims.filter(r=> r.t==='elim' ? b[r.f]>r.v : r.vals.includes(b[r.f])).map(r=> r.ex==='plane' ? 'plane_'+({'Nez plat':'flat','Restreint':'restr','Soute':'heavy'})[b.vo] : r.ex);
    if(sizeOK && !String(b.g).split(' / ').some(g=>sizeOK.includes(g))) ex.push('size');
    if(answers[23]===true && (b.pc==='Non' || (b.pc==='Moyen' && answers[25]!==true && answers[114]!==true))) ex.push('first');
    return {b,score:s/max+0.03*m/max,pct:Math.round(s/max*100),pros:uniq(pros).slice(0,3),cons:uniq(cons).slice(0,2),gaps:uniq(gaps).slice(0,4),ex};
  });
  const pool=all.filter(x=>!x.ex.length).sort((a,b)=>b.score-a.score || a.b.n.fr.localeCompare(b.b.n.fr));
  pool.forEach((x,i)=>x.rank=i+1);
  return {top:pool.slice(0,4),more:pool.slice(4,10),flags,all,total:pool.length};
}

const zipOk=(c,z)=> c==='FR' ? /^\d{5}$/.test(z) : /^\d{4}$/.test(z);

function submitProfile(e){
  e.preventDefault();
  const name=$('#f-name').value.trim(), email=$('#f-email').value.trim(), country=$('#f-country').value, zip=$('#f-zip').value.replace(/\s/g,'');
  ['e-consent','e-name','e-zip','e-email'].forEach(i=>$('#'+i).textContent='');
  if(!name){ $('#e-name').textContent=T('errName'); $('#f-name').focus(); return; }
  /* MODE TEST : l'e-mail n'est pas obligatoire pour l'instant (à rendre obligatoire avec les vrais comptes) */
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ $('#e-email').textContent=T('errEmail'); $('#f-email').focus(); return; }
  if(!zipOk(country,zip)){ $('#e-zip').textContent=T('errZip'); $('#f-zip').focus(); return; }
  if(!$('#f-consent').checked){ $('#e-consent').textContent=T('errConsent'); $('#f-consent').focus(); return; }
  const isNew=!profile;
  profile={name,email,lang:LANG,country,zip,news:$('#f-news').checked,consent:(profile&&profile.consent)||new Date().toISOString()};
  store.set('swoof-profile',profile); track('inscription');
  sendSheet({type:'inscription',prenom:name,email,langue:LANG,pays:I18N.fr.countries[country]||country,cp:zip,newsletter:profile.news});
  editing=false; goHome(); if(isNew) toast(T('suDone'));
}

/* ===== Carnet de santé ===== */
const DAY=864e5, REM_DAYS=5; /* délai par défaut : antiparasitaire, vermifuge, vétérinaire */
const fmtD=d=>d?new Intl.DateTimeFormat({fr:'fr-BE',en:'en-GB',nl:'nl-BE'}[LANG],{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(d+(String(d).length===10?'T00:00:00Z':''))):'';
const todayISO=()=>{ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }; /* date du jour locale (pas UTC) */
const addDays=(iso,n)=>{ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }; /* calcul en UTC : insensible au changement d'heure */
const addMonths=(iso,n)=>{ const d=new Date(iso+'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth()+n); return d.toISOString().slice(0,10); };
const FREQ={'3w':['d',21],'1m':['m',1],'3m':['m',3],'6m':['m',6],'1y':['m',12]};
const nextFrom=(iso,f)=>{ const x=FREQ[f]; if(!iso||!x) return ''; return x[0]==='d'?addDays(iso,x[1]):addMonths(iso,x[1]); };
const lastOf=items=>[...(items||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
const FREQS={verm:['1m','3m','custom'],para:['3w','1m','custom'],osteo:['6m','1y','free']};
function H(d){ d.health=d.health||{}; const h=d.health;
  h.steril=h.steril||{done:null,date:''}; h.vacc=h.vacc||[]; h.verm=h.verm||{freq:'3m',items:[]}; h.para=h.para||{freq:'1m',items:[]};
  h.osteo=h.osteo||{freq:'1y',items:[]}; h.vet=h.vet||[]; h.meds=h.meds||[]; h.allergies=(h.allergies||[]).map(a=>typeof a==='string'?{name:a}:a); h.alFood=h.alFood||[]; h.alCare=h.alCare||[]; h.desens=h.desens||{prod:'',items:[]}; h.alRemark=h.alRemark||''; h.alDocs=h.alDocs||[]; h.vetDocs=h.vetDocs||[]; h.osteoPro=h.osteoPro||{}; h.vetPro=h.vetPro||{};
  ['verm','para','osteo'].forEach(k=>{ if(!FREQS[k].includes(h[k].freq)) h[k].freq=FREQS[k][1]; }); return h; }
function saveDogs(){ return store.set('swouf-dogs',dogs); }
/* date du prochain soin d'une section à fréquence */
function secNext(h,k){ const sec=h[k]; if(sec.freq==='custom'||sec.freq==='free') return sec.customNext||''; const l=lastOf(sec.items); return l?nextFrom(l.date,sec.freq):''; }
const vaccNext=(h,kind)=>{ const l=lastOf(h.vacc.filter(v=>v.kind===kind)); return l?l.next:''; };
const desNext=h=>h.desens.items.filter(v=>v.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date))[0];
const vetNext=h=>h.vet.filter(v=>v.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date))[0];
function reminders(d){
  const h=H(d), out=[], t=todayISO();
  ['classic','rabies'].forEach(k=>{ const n=vaccNext(h,k); if(n) out.push({date:n,txt:T(k==='rabies'?'vRabies':'vClassic'),sec:'vacc',lead:30}); });
  [['verm','hVerm'],['para','hPara'],['osteo','hOsteo']].forEach(([k,l])=>{ const n=secNext(h,k); if(n) out.push({date:n,txt:T(l),sec:k,lead:k==='osteo'?osteoLead(h,n):REM_DAYS}); });
  const inj=desNext(h); if(inj) out.push({date:inj.date,txt:T('desensRem')+(inj.qty?' · '+inj.qty:''),sec:'allergy',lead:REM_DAYS});
  const v=vetNext(h); if(v) out.push({date:v.date,txt:T('vetAppt')+(v.who?' · '+v.who:''),sec:'vet'});
  h.meds.forEach(m=>{ if(!m.start) return; const end=addDays(m.start,(+m.days||1)-1); if(t>=m.start && t<=end) out.push({date:t,txt:`${T('medGive')} ${m.name}${m.dose?' ('+m.dose+')':''} · ${T('mf_'+m.freq)}`,sec:'meds'}); });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
/* ostéo : 15 jours si l'intervalle est de 6 mois ou moins, 1 mois si plus long */
function osteoLead(h,next){ const f=h.osteo.freq; if(f==='6m') return 15; if(f==='1y') return 30; const l=lastOf(h.osteo.items); if(!l) return 15; const months=(new Date(next)-new Date(l.date))/DAY/30.44; return months<=6.2?15:30; }
const soon=r=>r.date<=addDays(todayISO(),r.lead||REM_DAYS);
function remClass(iso){ const t=todayISO(); return iso<t?'late':iso===t?'today':''; }
function remWhen(iso){ const t=todayISO(); if(iso<t) return T('late'); if(iso===t) return T('today'); const n=Math.round((new Date(iso)-new Date(t))/DAY); return n===1?T('tomorrow'):n<=31?T('inDays').replace('{n}',n):fmtD(iso); }
function sterTxt(d){ const st=H(d).steril; if(st.done===null) return ''; const g=d.sex==='m'?'M':d.sex==='f'?'F':''; return T((st.done?'sterYes':'sterNo')+g); }
/* ---- page du chien : en-tête + rappels + tuiles ---- */
const TILES=[['vet','hVet','🩺'],['osteo','hOsteo','🤲'],['vacc','hVacc','💉'],['meds','hMeds','📋'],['para','hPara','🛡️'],['verm','hVerm','💊'],['allergy','hAllergy','⚠️']];
function tileInfo(h,k){
  if(k==='vacc'){ const n=[vaccNext(h,'classic'),vaccNext(h,'rabies')].filter(Boolean).sort()[0]; return n?{n}:{empty:!h.vacc.length}; }
  if(k==='verm'||k==='para'||k==='osteo'){ const n=secNext(h,k); return n?{n}:{empty:!h[k].items.length}; }
  if(k==='vet'){ const v=vetNext(h); return v?{n:v.date}:{txt:h.vet.length?T('vetCount').replace('{n}',h.vet.length):'',empty:!h.vet.length}; }
  if(k==='meds'){ const t=todayISO(), act=h.meds.filter(m=>m.start&&t>=m.start&&t<=addDays(m.start,(+m.days||1)-1)); return {txt:act.length?T('medActive').replace('{n}',act.length):T('medNone'),empty:!h.meds.length}; }
  if(k==='allergy'){ const n=desNext(h); if(n) return {n:n.date}; const any=h.allergies.length||h.alFood.length||h.alCare.length||h.desens.items.length; return {txt:h.allergies.length?h.allergies.map(a=>a.name).join(', '):(any?'':T('hEmptyA')),empty:!any}; }
}
function renderDogPage(){
  const d=dogs[selDog]; if(!d) return; const h=H(d), rem=reminders(d), st=h.steril;
  let x=`<div class="photo-pick" style="margin:6px 0 4px">${avatarHTML(d,'avatar big')}<div><h1 class="pg-title" style="margin:0">${esc(d.name)}</h1><p class="note" style="margin:2px 0 0">${esc([breedName(d.breed), d.sex?T(d.sex==='m'?'male':'female'):'', ageTxt(d.birth), sterTxt(d)].filter(Boolean).join(' · '))}</p>${d.chip?`<p class="note chip-l">${T('chipS')} ${esc(d.chip.replace(/(\d{3})(?=\d)/g,'$1 '))}</p>`:''}<button type="button" class="inline-link" id="dp-edit">${T('dfEdit')}</button></div></div>`;

/* photo compressée (≈150 Ko) ou PDF léger, gardés dans le téléphone en attendant les comptes en ligne */
function addDoc(arr,file){

  if(!/^image\//.test(file.type)){ info('alDocType'); return; }
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const sc=Math.min(1,1400/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); done({type:'img',name:file.name||'photo',data:c.toDataURL('image/jpeg',0.72),date:todayISO()}); };

  img.src=url;

}

/* affiche en image (1080×1350, format Instagram) */
function posterCanvas(d){ return new Promise(res=>{
  const l=d.lost, W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const F=(w,sz)=>`${w} ${sz}px Fredoka, Nunito, Arial, sans-serif`, N=(w,sz)=>`${w} ${sz}px Nunito, Arial, sans-serif`;
  const wrap=(t,x,y,mw,lh,max)=>{ const ws=String(t).split(/\s+/); let line='',n=0; for(const w of ws){ const tt=line?line+' '+w:w; if(g.measureText(tt).width>mw&&line){ g.fillText(line,x,y); y+=lh; line=w; if(++n>=max-1){ line+=' …'; break; } } else line=tt; } if(line) g.fillText(line,x,y); return y+lh; };
  const draw=img=>{ g.fillStyle='#FFF4E6'; g.fillRect(0,0,W,H); g.fillStyle='#E86A4F'; g.fillRect(0,0,W,170);
    g.fillStyle='#fff'; g.font=F(700,92); g.textAlign='center'; g.fillText(T('lostPosterH'),W/2,118);
    const ph=560, px=(W-ph)/2, py=210; g.save(); g.beginPath(); g.roundRect?g.roundRect(px,py,ph,ph,40):g.rect(px,py,ph,ph); g.clip();
    if(img){ const m=Math.min(img.width,img.height); g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,px,py,ph,ph); } else { g.fillStyle='#F7E9D7'; g.fillRect(px,py,ph,ph); g.font=F(700,200); g.fillStyle='#E86A4F'; g.fillText('🐾',W/2,py+ph/2+70); }
    g.restore(); let y=py+ph+86; g.fillStyle='#2A1E18'; g.font=F(700,76); g.fillText(d.name,W/2,y);
    const info=[breedName(d.breed),d.sex?T(d.sex==='m'?'male':'female'):'',ageTxt(d.birth)].filter(Boolean).join(' · ');
    if(info){ y+=56; g.font=N(600,38); g.fillStyle='#6B5549'; g.fillText(info,W/2,y); }
    y+=62; g.font=N(700,38); g.fillStyle='#B8452D'; g.fillText(`${T('lostOn')} ${fmtD(l.date)} · ${l.zip}${l.place?' · '+l.place:''}`,W/2,y);
    y+=58; g.font=N(400,34); g.fillStyle='#2A1E18'; y=wrap(l.desc,W/2,y,900,46,3);
    if(l.tel){ g.fillStyle='#2A1E18'; g.fillRect(140,H-190,W-280,96); g.fillStyle='#fff'; g.font=F(700,54); g.fillText('📞 '+l.tel,W/2,H-125); }
    g.font=N(700,28); g.fillStyle='#6B5549'; g.fillText('Swouf · '+T('slogan2'),W/2,H-40);
    c.toBlob(b=>res(b),'image/png'); };
  if(l.photo){ const im=new Image(); im.onload=()=>draw(im); im.onerror=()=>draw(null); im.src=l.photo; } else draw(null); }); }
async function sharePoster(d){
  const blob=await posterCanvas(d); if(!blob) return; const name=`chien-perdu-${(d.name||'swouf').toLowerCase().replace(/[^a-z0-9]+/g,'-')}.png`;
  const file=new File([blob],name,{type:'image/png'}), text=T('lostShareTxt').replace('{name}',d.name).replace('{zip}',d.lost.zip);
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }

}

let vtZip='', vtShown=12;
function openVets(){ const w=profile||quizInfo||{}; vtZip=(w.country==='BE'&&w.zip)?w.zip:(vtZip||''); $('#vt-zip').value=vtZip; vtShown=12; renderVets(); show('vets'); }
function zipLL(z){ const n=parseInt(z,10); if(isNaN(n)) return null; if(GEO.be[n]) return GEO.be[n]; let best=null,d=1e9; for(const k in GEO.be){ const dd=Math.abs(k-n); if(dd<d){d=dd;best=GEO.be[k];} } return d<=60?best:null; }
function renderVets(){
  const z=($('#vt-zip').value||'').replace(/\s/g,''), out=$('#vtBody');
  if(!/^\d{4}$/.test(z)){ out.innerHTML=`<p class="hs-empty">${T('vtNeed')}</p>`; return; }
  const ll=zipLL(z); if(!ll){ out.innerHTML=`<p class="hs-empty">${T('vtNeed')}</p>`; return; }
  const n=parseInt(z,10), wal=(n>=1300&&n<=1499)||(n>=4000&&n<=7999);
  const list=VETS.map(v=>({v,d:km(ll,[v[7],v[8]])})).sort((a,b)=>a.d-b.d);
  let x=wal?'':`<p class="hs-tip">${T('vtOnlyWal')}</p>`;
  x+=`<p class="hs-empty" style="margin:4px 0 10px">${T('vtNear').replace('{zip}',esc(z))}</p><div class="vt-grid">`+list.slice(0,vtShown).map(({v,d})=>{ const tel=(v[2].split('/')[0]||'').replace(/[^0-9+]/g,''), web=v[3]?(v[3].startsWith('http')?v[3]:'https://'+v[3]):'';
    const maps=`https://www.google.com/maps/search/?api=1&query=${v[7]},${v[8]}`;
    return `<div class="vt-card"><strong class="vt-n">${esc(v[0]||T('vtNoName'))}</strong><span class="vt-l">${esc(v[5]||v[6])} · ${Math.max(1,Math.round(d))} km</span><span class="vt-a">${esc(v[1])}</span><div class="vt-b">${tel?`<a href="tel:${tel}" aria-label="${T('vtCall')}">📞</a>`:''}${web?`<a href="${esc(web)}" target="_blank" rel="noopener" aria-label="${T('vtWeb')}">🌐</a>`:''}<a href="${maps}" target="_blank" rel="noopener" aria-label="${T('vtMap')}">📍</a></div></div>`; }).join('')+`</div>`;
  if(vtShown<list.length && vtShown<60) x+=`<button type="button" class="btn btn-soft" id="vt-more" style="margin-top:12px">${T('vtMore')}</button>`;
  x+=`<p class="note" style="margin-top:12px">${T('vtSrc')}</p>`;
  out.innerHTML=x; if($('#vt-more')) $('#vt-more').onclick=()=>{ vtShown+=12; renderVets(); };
}

const dogInitial=d=>esc((d.name||'?').trim().charAt(0).toUpperCase());
const avatarHTML=(d,cls='avatar')=>`<span class="${cls}">${d.photo?`<img src="${d.photo}" alt="">`:dogInitial(d)}</span>`;
function ageTxt(b){ if(!b) return ''; const d=new Date(b), n=new Date(); let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth(); if(n.getDate()<d.getDate()) m--; if(m<0) return ''; return m<12 ? T('ageM').replace('{n}',m) : T('ageY').replace('{n}',Math.floor(m/12)); }
const breedName=v=> v==='__x' ? T('dfCross') : (BREEDS.find(b=>b.n.fr===v) ? L(BREEDS.find(b=>b.n.fr===v).n) : (v||''));
function renderDash(){
  $('#d-hello').textContent = T('hiName').replace('{name}', profile&&profile.name ? profile.name : '');
  if(selDog>=dogs.length) selDog=0;
  $('#dogRow').innerHTML = dogs.map((d,i)=>`<button type="button" class="dog-pill ${i===selDog?'sel':''}" data-sel="${i}">${avatarHTML(d)}<span>${esc(d.name)}</span></button>`).join('')
    + `<button type="button" class="dog-pill addp ${dogs.length>=MAX_DOGS?'locked':''}" id="dr-add"><span class="avatar add">${ICON_PLUS}</span><span>${T('add')}</span>${dogs.length>=MAX_DOGS?`<span class="soon">${T('soon')}</span>`:''}</button>`;
  const d=dogs[selDog];
  $('#dogCard').innerHTML = d ? `<div class="dog-card"><span class="k">${T('dcK')}</span><span class="t">${esc(d.name)}</span><span>${dogNext(d)}</span><button type="button" class="btn" id="dc-open">${T('dcOpen').replace('{name}',esc(d.name))}</button></div>`
    : `<div class="dog-card"><span class="k">${T('dcK')}</span><span class="t">${T('dcFirst')}</span><span>${T('dcFirstP')}</span><button type="button" class="btn" id="dc-add">${T('addDog')}</button></div>`;
  document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ selDog=+b.dataset.sel; renderDash(); });
  $('#dr-add').onclick=addDog;
  if($('#dc-open')) $('#dc-open').onclick=()=>{ renderDogPage(); show('dogpage'); };
  if($('#dc-add')) $('#dc-add').onclick=()=>openDogForm(-1);
}
function dogNext(d){ const r=reminders(d)[0]; return r ? `${T('nextRem')} <strong>${esc(r.txt)}</strong> · ${remWhen(r.date)}` : T('dcNone'); }
function renderDogs(){
  $('#dogs-add').textContent=T(dogs.length>=MAX_DOGS?'addDog2':'addDog'); $('#dogs-add').classList.toggle('btn-soft',dogs.length>=MAX_DOGS); $('#dogs-add').classList.toggle('btn-dark',dogs.length<MAX_DOGS);
  $('#dogList').innerHTML = dogs.length ? dogs.map((d,i)=>`<button type="button" class="dog-item" data-dog="${i}">${avatarHTML(d)}<span style="flex:1"><strong>${esc(d.name)}</strong><small>${esc([breedName(d.breed),ageTxt(d.birth)].filter(Boolean).join(' · '))}</small></span>${ICON_CHEV}</button>`).join('') : `<p class="note">${T('noDogs')}</p>`;
  document.querySelectorAll('[data-dog]').forEach(b=>b.onclick=()=>{ selDog=+b.dataset.dog; renderDogPage(); show('dogpage'); });
}

/* race : champ de recherche avec suggestions (ignore accents et ordre des mots) */
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function fillBreeds(){ const v=$('#df-breed').value; $('#df-breedQ').value=v?breedName(v):''; }
function breedSugg(){
  const q=norm($('#df-breedQ').value).trim(), box=$('#df-sugg'), words=q.split(/[\s\-()]+/).filter(Boolean);
  if(!words.length){ box.classList.add('hidden'); $('#df-breedQ').setAttribute('aria-expanded','false'); return; }
  const list=BREEDS.map(b=>({v:b.n.fr,l:L(b.n),k:norm(L(b.n)+' '+b.n.fr)})).filter(o=>words.every(w=>o.k.includes(w)))
    .sort((a,b)=>(norm(b.l).startsWith(words[0])-norm(a.l).startsWith(words[0]))||a.l.localeCompare(b.l,LANG)).slice(0,8);
  list.push({v:'__x',l:T('dfCross')});
  box.innerHTML=list.map(o=>`<li role="option" data-bv="${esc(o.v)}">${esc(o.l)}</li>`).join('');
  box.classList.remove('hidden'); $('#df-breedQ').setAttribute('aria-expanded','true');
  box.querySelectorAll('[data-bv]').forEach(li=>li.onpointerdown=e=>{ e.preventDefault(); $('#df-breed').value=li.dataset.bv; $('#df-breedQ').value=li.textContent; box.classList.add('hidden'); $('#df-breedQ').setAttribute('aria-expanded','false'); });
}
const MAX_DOGS=1; /* 2e chien : bientôt (abonnement à l'étude) */
const MAX_DOCS=3; /* documents par chien, vétérinaire + allergies confondus (plus : bientôt) */
function addDog(){ if(dogs.length>=MAX_DOGS) return askConfirm(T('dog2Soon'),()=>{},T('ok'),true); openDogForm(-1); }
function openDogForm(i){
  editDog=i; const d=i>=0?dogs[i]:{}; dogPhoto=d.photo||'';
  $('#df-title').textContent=T(i>=0?'dfEdit':'addDog'); $('#df-name').value=d.name||''; $('#df-breed').value=d.breed||''; fillBreeds(); $('#df-sugg').classList.add('hidden'); $('#df-birth').value=d.birth||''; $('#df-sex').value=d.sex||''; $('#edf-name').textContent=''; const st=(d.health&&d.health.steril)||{}; $('#df-ster').value=st.done===true?'1':st.done===false?'0':''; $('#df-sterd').value=st.date||''; $('#df-chip').value=d.chip||''; $('#df-chip').placeholder=T('dfChipEx'); $('#df-sterdF').classList.toggle('hidden',$('#df-ster').value!=='1');
  $('#df-photoPrev').innerHTML = dogPhoto?`<img src="${dogPhoto}" alt="">`:'+'; $('#df-del').classList.toggle('hidden',i<0); $('#df-lost').classList.toggle('hidden',i<0); show('dogform');
}
function submitDog(e){
  e.preventDefault(); const name=$('#df-name').value.trim(); $('#edf-name').textContent='';
  if(!name){ $('#edf-name').textContent=T('errDog'); $('#df-name').focus(); return; }
  const bq=$('#df-breedQ').value.trim(), bv=$('#df-breed').value, breed=!bq?'':(bv&&breedName(bv)===bq?bv:(BREEDS.find(b=>norm(L(b.n))===norm(bq)||norm(b.n.fr)===norm(bq))||{n:{fr:bq}}).n.fr);
  const d={...(editDog>=0?dogs[editDog]:{}),name,breed,birth:$('#df-birth').value,sex:$('#df-sex').value,photo:dogPhoto,chip:$('#df-chip').value.replace(/[^0-9A-Za-z]/g,'')};
  const sv2=$('#df-ster').value; d.health=d.health||{}; d.health.steril={done:sv2==='1'?true:sv2==='0'?false:null,date:sv2==='1'?$('#df-sterd').value:''};
  if(editDog>=0) dogs[editDog]=d; else { dogs.push(d); selDog=dogs.length-1; }
  store.set('swouf-dogs',dogs); goHome();

const visible = q => !q.show || q.show(answers);

function start(){ answers={}; path=[]; idx=nextIndex(0); show('quiz'); render(); track('quiz_debut'); }
function render(){
  const q=QUESTIONS[idx], done=path.length, total=totalVisible(), pct=Math.round(done/total*100);

  const c=document.createElement('div'); c.className='card';

function answer(val, card){
  const q=QUESTIONS[idx];
  const go=()=>{ answers[q.id]=val; path.push(idx); const n=nextIndex(idx+1); if(n<0) finish(); else { idx=n; render(); } };
  if(card && val!==null && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    card.style.transition='transform .28s ease, opacity .28s ease';
    card.style.transform=`translateX(${val?520:-520}px) rotate(${val?22:-22}deg)`; card.style.opacity='0';

}
function drag(card){
  let x0=null,dx=0; const y=card.querySelector('.stamp.yes'), n=card.querySelector('.stamp.no');
  card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none';});
  card.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; y.style.opacity=Math.max(0,Math.min(1,dx/90)); n.style.opacity=Math.max(0,Math.min(1,-dx/90)); });

}

function region(){
  const w=who(), c=w&&w.country, z=parseInt((w&&w.zip)||'',10);
  if(c==='FR') return 'fr';
  if(c==='BE'){ if(isNaN(z)) return 'be'; if(z>=1000&&z<=1299) return 'bru'; if((z>=1300&&z<=1499)||(z>=4000&&z<=7999)) return 'wal'; if((z>=1500&&z<=3999)||(z>=8000&&z<=9999)) return 'fla'; return 'be'; }
  return w ? 'other' : 'be';
}
function userLL(){
  const w=who(); if(!w||!w.zip) return null; const z=w.zip.replace(/\s/g,'');
  if(w.country==='BE'){ const n=parseInt(z,10); if(isNaN(n)) return null; if(GEO.be[n]) return GEO.be[n]; let best=null,d=1e9; for(const k in GEO.be){ const dd=Math.abs(k-n); if(dd<d){d=dd;best=GEO.be[k];} } return best; }
  if(w.country==='FR'){ let d=z.slice(0,2); if(d==='20') d=(parseInt(z,10)>=20200?'2B':'2A'); return GEO.fr[d]||null; }
  return null;
}
function refRegion(r){ if(r.cc==='FR') return 'fr'; const z=parseInt(r.z,10); if(z>=1000&&z<=1299) return 'bru'; if((z>=1300&&z<=1499)||(z>=4000&&z<=7999)) return 'wal'; return 'fla'; }
function km(a,b){ const R=6371, r=x=>x*Math.PI/180, dl=r(b[0]-a[0]), dn=r(b[1]-a[1]); const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function refugePanel(){
  let body=`<p>${T('refugeP')}</p>`;

  if(ll){
    const rg=region(), all=REFUGES.map(r=>({r,d:km(ll,r.ll),rg:refRegion(r)})).sort((a,b)=>a.d-b.d);
    const same=all.filter(x=>x.rg===rg || (rg==='be' && x.r.cc==='BE'));
    const two=(same.length>=2?same:all).slice(0,2);

}

const ICON_PLUS=`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`, ICON_CHEV=`<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
function wrap(g,text,x,y,max,lh,align,maxLines){ if(align) g.textAlign=align; const words=String(text).split(' '); let line='', lines=[];
  for(const w of words){ const test=line?line+' '+w:w; if(g.measureText(test).width>max && line){ lines.push(line); line=w; } else line=test; } if(line) lines.push(line);
  if(maxLines && lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]+='…'; }
  lines.forEach((l,i)=>g.fillText(l,x,y+i*lh)); return y+(lines.length-1)*lh; }
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitText(g,t,x,y,max){ let s=58; while(g.measureText(t).width>max && s>30){ s-=2; g.font=`600 ${s}px Fredoka, Trebuchet MS, sans-serif`; } g.fillText(t,x,y); }

function renderHistory(){
  const fmt=new Intl.DateTimeFormat({fr:'fr-BE',en:'en-GB',nl:'nl-BE'}[LANG],{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  $('#hist-list').innerHTML = history.length ? history.map((h,i)=>{ const r=compute(h.answers); return `<div class="hist-row" data-i="${i}"><button class="del" data-del="${i}">🗑️ ${T('delAction')}</button><button class="hist-item" data-h="${i}"><span><strong>${r.top.map(m=>esc(L(m.b.n))).join(', ')}</strong><br><small>${fmt.format(new Date(h.date))}</small></span><span aria-hidden="true">›</span></button></div>`; }).join('') : `<p class="note">${T('histEmpty')}</p>`;
  document.querySelectorAll('.hist-row').forEach(row=>{
    const it=row.querySelector('.hist-item'); let x0=null,dx=0,moved=false;
    it.addEventListener('pointerdown',e=>{ x0=e.clientX; dx=0; moved=false; it.style.transition='none'; });
    it.addEventListener('pointermove',e=>{ if(x0===null) return; dx=Math.min(0,e.clientX-x0); if(dx<-8) moved=true; it.style.transform=`translateX(${Math.max(dx,-110)}px)`; });
    const end=()=>{ if(x0===null) return; x0=null; it.style.transition='transform .2s ease'; it.style.transform= dx<-60 ? 'translateX(-100px)' : ''; };
    it.addEventListener('pointerup',end); it.addEventListener('pointercancel',end);
    it.addEventListener('click',e=>{ if(moved){ e.preventDefault(); return; } if(it.style.transform==='translateX(-100px)'){ it.style.transform=''; return; } openResults(history[+row.dataset.i].answers); });
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.del, removed=history.splice(i,1)[0]; store.set('swoof-history',history); renderHistory(); toast(T('histDel'),()=>{ history.splice(i,0,removed); store.set('swoof-history',history); renderHistory(); }); });
}

/* ===== Compte en ligne (Supabase + Google) =====
   Les données restent aussi dans le téléphone : l'app fonctionne même hors ligne.
   Connecté : profil + chiens + carnet sont enregistrés en ligne et retrouvés sur tous les appareils. */
const SB_URL='https://wfwjrgwgtyiiavpsycns.supabase.co', SB_KEY='sb_publishable_afOKFuQhrbDn0dde6CkI9w_FaCkUIB4';
let sb=null, sbUser=null, cloudPulled=false, cloudBusy=false, cloudAgain=false, cloudT=null, skipCloud=false;
function cloudInit(){
  try{ if(!window.supabase||!window.supabase.createClient) return; sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'swouf-auth'}}); }catch(e){ sb=null; return; }
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session&&session.user, before=sbUser&&sbUser.id; sbUser=u||null;
    if(u&&before!==u.id){ cloudPulled=false; setTimeout(()=>cloudPull(ev==='SIGNED_IN'),0); }
    if(!u){ cloudPulled=false; }
    renderCloudUI(); });
}
function googleLogin(){
  if(!sb){ toast(T('gOffline')); return; }
  store.set('swouf-auth-return', curScreen);
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}}).catch(()=>toast(T('gErr')));
}
const gName=u=>{ const m=(u&&u.user_metadata)||{}; return (m.full_name||m.name||'').split(' ')[0]||''; };
async function cloudPull(fresh){
  if(!sb||!sbUser) return;
  try{
    const [pr,dr]=await Promise.all([sb.from('profiles').select('*').eq('id',sbUser.id).maybeSingle(), sb.from('dogs').select('id,data,position').order('position')]);
    if(pr.error||dr.error){ toast(T('gErr')); return; }
    const server=(dr.data||[]).map(r=>Object.assign({},r.data,{sid:r.id}));
    const localNew=(dogs||[]).filter(d=>!d.sid);
    dogs=server.concat(localNew); localStorage.setItem('swouf-dogs',JSON.stringify(dogs));
    const prof=pr.data;
    if(prof){ profile=Object.assign({},profile||{},{name:prof.name||(profile&&profile.name)||gName(sbUser),email:sbUser.email,country:prof.country||'BE',zip:prof.zip||'',lang:prof.lang||LANG,consent:(profile&&profile.consent)||prof.created_at,cloud:true,notif:{r:prof.notif_reminders!==false,p:!!prof.notif_promo}}); localStorage.setItem('swoof-profile',JSON.stringify(profile)); }
    else if(profile){ profile.email=profile.email||sbUser.email; profile.cloud=true; localStorage.setItem('swoof-profile',JSON.stringify(profile)); }
    cloudPulled=true;
    if(localNew.length||(!prof&&profile)) { await cloudPush(); if(localNew.length) toast(T('gImported')); }
    if(profile&&profile.lang&&profile.lang!==LANG) setLang(profile.lang);
    const back=store.get('swouf-auth-return','');
    if(!profile){ editing=false; fillForm(); $('#f-name').value=$('#f-name').value||gName(sbUser); show('signup'); }
    else if(fresh||back){ if(fresh&&!prof&&!back) toast(T('suDone')); else if(fresh) toast(T('gWelcome').replace('{name}',profile.name||'')); goHome(); }
    else if(curScreen==='welcome') goHome(); else refreshScreen();
    store.del('swouf-auth-return'); renderCloudUI(); syncReminders();
  }catch(e){ toast(T('gErr')); }
}
function cloudQueue(){ if(!sb||!sbUser||!cloudPulled) return; clearTimeout(cloudT); cloudT=setTimeout(cloudPush,1200); }
async function cloudPush(){
  if(!sb||!sbUser) return; if(cloudBusy){ cloudAgain=true; return; } cloudBusy=true;
  try{
    if(profile){ const nf=profile.notif||{}; await sb.from('profiles').upsert({id:sbUser.id,name:profile.name||null,country:profile.country||null,zip:profile.zip||null,lang:LANG,notif_reminders:nf.r!==false,notif_promo:!!nf.p}); }
    for(let i=0;i<dogs.length;i++){ const d=dogs[i], data=Object.assign({},d); delete data.sid;
      if(d.sid){ await sb.from('dogs').update({data,position:i}).eq('id',d.sid); }
      else { const r=await sb.from('dogs').insert({data,position:i}).select('id').single(); if(r.data) d.sid=r.data.id; } }
    const keep=dogs.map(d=>d.sid).filter(Boolean); let q=sb.from('dogs').delete().eq('user_id',sbUser.id); if(keep.length) q=q.not('id','in','('+keep.join(',')+')'); await q;
    localStorage.setItem('swouf-dogs',JSON.stringify(dogs));
    await syncReminders();
  }catch(e){} finally{ cloudBusy=false; if(cloudAgain){ cloudAgain=false; cloudPush(); } }
}
function refreshScreen(){ if(curScreen==='dash') renderDash(); else if(curScreen==='dogs') renderDogs(); else if(curScreen==='me') renderMe(); else if(curScreen==='dogpage') renderDogPage(); }

  document.querySelectorAll('[data-glogin]').forEach(b=>b.onclick=googleLogin);
  if($('#g-logout')) $('#g-logout').onclick=()=>askConfirm(T('gLogoutQ'),async()=>{ try{ await sb.auth.signOut(); }catch(e){} ['swoof-profile','swouf-dogs','swoof-history','swouf-quizinfo'].forEach(k=>store.del(k)); profile=null; dogs=[]; history=[]; quizInfo=null; show('welcome'); toast(T('gLoggedOut')); },T('gLogout'));

/* ===== Notifications sur le téléphone (Web Push via Supabase) ===== */
let VAPID='';
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=x=>{ const p='='.repeat((4-x.length%4)%4), b=atob((x+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); };
async function getVapid(){ if(VAPID) return VAPID; const r=await fetch(SB_URL+'/functions/v1/notifications?action=key',{headers:{apikey:SB_KEY}}); const j=await r.json(); VAPID=j.publicKey||''; return VAPID; }
function pushState(){ if(!pushSupported()) return isIOS&&!isStandalone()?'ios':'unsupported'; if(Notification.permission==='denied') return 'denied'; return (Notification.permission==='granted'&&store.get('swouf-push',''))?'on':'off'; }
async function enablePush(){
  const info=k=>askConfirm(T(k),()=>{},'OK',true);
  if(!sbUser) return toast(T('npNeedLogin'));
  const st=pushState(); if(st==='ios') return info('npIOS'); if(st==='unsupported') return info('npUnsupported');
  try{
    const perm=await Notification.requestPermission(); if(perm!=='granted'){ renderNotifUI(); return info('npDenied'); }
    await ensurePushSub(); store.set('swouf-push','1'); toast(T('npOn')); renderNotifUI(); syncReminders();
  }catch(e){ toast(T('npErr')); }
}
/* inscrit le téléphone avec la clé actuelle (et le réinscrit si la clé a changé) */
async function ensurePushSub(){
  const reg=await navigator.serviceWorker.ready, key=await getVapid(); if(!key) throw new Error('key');
  let sub=await reg.pushManager.getSubscription();
  if(sub&&store.get('swouf-push-key','')!==key){ try{ await sub.unsubscribe(); }catch(e){} sub=null; }
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  store.set('swouf-push-key',key);
  const j=sub.toJSON(); const r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,180)},{onConflict:'endpoint'});
  if(r.error) throw r.error; return sub;
}
async function testPush(){
  try{ if(Notification.permission==='granted') await ensurePushSub(); }catch(e){}
  try{ const {data}=await sb.auth.getSession(); const tok=data&&data.session&&data.session.access_token;
    const r=await fetch(SB_URL+'/functions/v1/notifications?action=test',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({title:'Swouf 🐾',body:T('npTestBody')})});
    const j=await r.json(); toast(j.sent?T('npTestOk'):T('npTestNone'));
  }catch(e){ toast(T('npErr')); }
}
async function setNotifPref(k,v){ profile.notif=Object.assign({r:true,p:false},profile.notif||{}); profile.notif[k]=v; store.set('swoof-profile',profile); renderNotifUI(); }
/* rappels calculés ici (mêmes règles que « À prévoir ») et envoyés à Supabase, qui les expédie le bon matin */
function buildPushRows(){
  const t=todayISO(), out=[], add=(on,title,body)=>{ if(on>t) out.push({send_on:on,title,body,url:'./'}); };
  (dogs||[]).forEach(d=>{ const h=H(d);
    reminders(d).forEach(r=>{ if(r.sec==='meds') return; const lead=r.lead||REM_DAYS;
      add(addDays(r.date,-lead),'🐾 '+d.name,T('npSoon').replace('{what}',r.txt).replace('{n}',lead).replace('{date}',fmtD(r.date)));
      add(r.date,'🐾 '+d.name,T('npToday').replace('{what}',r.txt)); });
    h.meds.forEach(m=>{ if(!m.remind||!m.start) return; const n=Math.min(+m.days||1,60); for(let i=0;i<n;i++) add(addDays(m.start,i),'💊 '+d.name,T('npMed').replace('{what}',m.name+(m.dose?' ('+m.dose+')':''))); }); });
  return out.slice(0,300);
}
async function syncReminders(){ if(!sb||!sbUser||!cloudPulled) return; try{ const rows=buildPushRows(); await sb.from('reminders').delete().eq('user_id',sbUser.id).eq('sent',false); if(rows.length) await sb.from('reminders').insert(rows); }catch(e){} }
function renderNotifUI(){
  const c=$('#notifCard'); if(!c) return; c.classList.toggle('hidden',!sbUser); if(!sbUser) return;
  const nf=Object.assign({r:true,p:false},(profile&&profile.notif)||{}), st=pushState();
  const sw=(k,on,lbl,sub,dis)=>`<label class="nt-row ${dis?'dis':''}"><span class="nt-t"><strong>${lbl}</strong>${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" class="nt-sw" data-np="${k}" ${on?'checked':''} ${dis?'disabled':''}></label>`;
  const status={on:`<p class="nt-ok">✅ ${T('npOnHere')}</p><button type="button" class="btn btn-soft" id="np-test">🔔 ${T('npTest')}</button>`,
    off:`<button type="button" class="btn btn-dark" id="np-on">🔔 ${T('npEnable')}</button>`,
    denied:`<p class="nt-warn">${T('npDeniedS')}</p>`, ios:`<p class="nt-warn">📱 ${T('npIOS')}</p>`, unsupported:`<p class="nt-warn">${T('npUnsupported')}</p>`}[st];
  c.innerHTML=`<h2 class="idea-t">🔔 ${T('npT')}</h2>${status}<div class="nt-list">${sw('r',nf.r,T('npRem'),T('npRemS'))}${sw('l',false,T('npLost'),T('soon'),true)}${sw('p',nf.p,T('npPromo'),T('npPromoS'))}</div>`;
  if($('#np-on')) $('#np-on').onclick=enablePush; if($('#np-test')) $('#np-test').onclick=testPush;
  c.querySelectorAll('[data-np]').forEach(i=>i.onchange=()=>setNotifPref(i.dataset.np,i.checked));
}

(function init(){
  let l=(profile&&profile.lang)||store.get('swouf-lang',''); if(!l){ const n=(navigator.language||'fr').slice(0,2); l=['fr','en','nl'].includes(n)?n:'fr'; }
  setLang(l); goHome();
  cloudInit(); renderCloudUI();
})();

/* enveloppe chaque champ date dans un cadre propre (même ceux créés plus tard) */
(function(){ const wrap=root=>{ (root.querySelectorAll?root:document).querySelectorAll('input[type="date"]').forEach(i=>{ if(i.parentNode.classList&&i.parentNode.classList.contains('datebox')) return; const b=document.createElement('span'); b.className='datebox'; i.parentNode.insertBefore(b,i); b.appendChild(i); }); };
  wrap(document); new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1){ if(n.matches&&n.matches('input[type="date"]')) wrap(n.parentNode); else wrap(n); } }))).observe(document.body,{childList:true,subtree:true}); })();
</script>
