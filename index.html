.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 0 4px}
.hero .logo-icon{width:96px}.hero .word{font-size:clamp(50px,15vw,64px)}
.slogan{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(20px,5.8vw,26px);margin:6px 0 0}
.tagline{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--coral-strong);margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.topbar .logo-icon{width:44px}.topbar .word{font-size:25px}
.home-btn{background:none;border:0;padding:4px 0;min-height:44px;display:flex;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 4px;min-height:44px;font-size:15px}
.linkbtn:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;text-decoration:none;width:100%}
.btn-primary{background:var(--coral-strong);color:#fff}.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-soft{background:var(--card);border-color:var(--line);color:var(--ink)}
.form,.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px}
.form{display:flex;flex-direction:column;gap:14px}
.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input,.field select,textarea{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px}
textarea{min-height:90px;padding:10px 14px;resize:vertical}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--coral);outline:none}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.help{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.err{color:var(--coral-strong);font-size:14px;font-weight:600;margin:4px 0 0}.err:empty{display:none}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-btn{min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.lang-btn[aria-pressed=true]{border-color:var(--coral-strong);background:var(--coral-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--coral-strong);flex:none}
.small{font-size:13.5px;color:var(--muted);margin:0}
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;margin-top:6px}
.legal-links button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px}
/* Accueil connecté */
.hello{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600;text-align:center;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:12px}
/* Tutoriel */
.tuto-demo{position:relative;height:220px;border-radius:24px;background:#FCE7DC;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tuto-card{width:170px;height:150px;background:var(--card);border:2px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;position:relative;animation:tutoSwipe 4s ease-in-out infinite}
.tuto-card .st{position:absolute;top:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;border:3px solid;border-radius:8px;padding:0 8px;opacity:0}
.tuto-card .st.y{left:10px;color:var(--good);animation:tutoYes 4s infinite}
.tuto-card .st.n{right:10px;color:var(--coral-strong);animation:tutoNo 4s infinite}
.tuto-hand{position:absolute;font-size:40px;bottom:6px;left:50%;animation:tutoHand 4s ease-in-out infinite}
@keyframes tutoSwipe{0%,10%{transform:none}30%,40%{transform:translateX(70px) rotate(10deg)}50%,60%{transform:none}80%,90%{transform:translateX(-70px) rotate(-10deg)}100%{transform:none}}
@keyframes tutoHand{0%,10%{transform:translateX(-50%)}30%,40%{transform:translateX(20px)}50%,60%{transform:translateX(-50%)}80%,90%{transform:translateX(-120px)}100%{transform:translateX(-50%)}}
@keyframes tutoYes{0%,15%{opacity:0}30%,40%{opacity:1}50%,100%{opacity:0}}
@keyframes tutoNo{0%,65%{opacity:0}80%,90%{opacity:1}100%{opacity:0}}
.tuto-legend{display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:15px}
.tuto-legend .y{color:var(--good);text-align:right}.tuto-legend .n{color:var(--coral-strong)}
.note-box{background:var(--coral-soft);border-radius:18px;padding:14px 16px;font-weight:600}
/* Quiz */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--coral);border-radius:99px;transition:width .3s ease}
.theme-label{color:var(--muted);font-weight:600;font-size:15px;margin:0}
.encourage{background:var(--good-soft);color:var(--good);font-weight:700;border-radius:14px;padding:8px 14px;text-align:center;font-size:15px}
.stage{position:relative;flex:1;min-height:360px;display:flex}
.card{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px 22px 26px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;box-shadow:0 18px 40px -24px rgba(42,30,24,.35)}
.card.behind{transform:scale(.95) translateY(14px);opacity:.6;box-shadow:none}
.illu{height:150px;margin:-6px -6px 16px;border-radius:20px;background:#FCE7DC;overflow:hidden}
.illu svg{width:100%;height:100%;display:block}
.card .q{font-family:'Fredoka',sans-serif;font-size:clamp(21px,5.6vw,26px);font-weight:600;line-height:1.22}
.card .hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.stamp{position:absolute;top:24px;padding:4px 14px;border-radius:12px;border:3px solid;font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;opacity:0;pointer-events:none;background:var(--card)}
.stamp.yes{left:20px;color:var(--good);border-color:var(--good);transform:rotate(-10deg)}
.stamp.no{right:20px;color:var(--coral-strong);border-color:var(--coral-strong);transform:rotate(10deg)}
.controls{display:flex;align-items:center;justify-content:center;gap:26px}
.round{width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--card);font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;gap:2px}
.round svg{width:24px;height:24px}
.round.yes{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.under{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.count{font-variant-numeric:tabular-nums}
/* Résultats */
#r-title{font-size:clamp(26px,7vw,32px)}
.lead{color:var(--muted);margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.match.first{border-color:var(--coral)}
.match h2{font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--coral-strong);line-height:1}
.pct small{font-size:12px;font-weight:500;color:var(--muted)}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--coral);border-radius:99px}
.facts{margin:0;font-size:12.5px;line-height:1.35}
.facts div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding:2px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:700;text-align:right}
.car{margin:0;font-size:13px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.tags li{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:700;line-height:1.35}
.tags.good li{background:var(--good-soft);color:var(--good)}.tags.warn li{background:var(--warn-soft);color:var(--warn)}
.vig{font-size:12px;color:var(--muted);margin:0;line-height:1.35}
.cross{display:inline-block;vertical-align:middle;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.panel h3{font-size:20px;margin-bottom:8px}.panel p{margin:0 0 10px}.panel ul{margin:0;padding-left:20px}.panel li{margin-bottom:6px}
.panel.ebook{background:var(--coral-soft);border-color:var(--coral)}
.panel.refuge{border-style:dashed}
.more{display:flex;flex-direction:column;gap:10px}
.mini-match{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.mini-match summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer;min-height:54px}
.mini-match summary::-webkit-details-marker{display:none}
.mm-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;line-height:1.2}
.mm-name small{display:block;font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:var(--muted)}
.mm-pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;color:var(--coral-strong)}
.mm-body{padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.wish select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 12px;margin-bottom:10px}
.stars{display:flex;gap:6px;margin:4px 0 12px}
.stars button{background:none;border:0;font-size:32px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:#F2A93B}
.hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.hist-item small{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(42,30,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:24px;margin-bottom:10px}.sheet h3{font-size:18px;margin:16px 0 6px}.sheet p{margin:0 0 8px;font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.ref-list{list-style:none;padding:0!important;margin:12px 0 0!important;display:flex;flex-direction:column;gap:10px}
.ref-item{background:var(--bg);border-radius:16px;padding:12px 14px}
.ref-item strong{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;line-height:1.25}
.ref-item small{color:var(--muted);display:block;margin:2px 0 8px}
.ref-links{display:flex;gap:8px;flex-wrap:wrap}
.ref-links a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.section-title{font-size:20px;margin:6px 0 -6px}
</style>
</head>

const LEGAL = {
fr:{mentions:`<h2 id="legal-title">Mentions légales</h2><p><strong>Éditrice :</strong> [Prénom Nom ou nom de l'entreprise], [adresse], [numéro d'entreprise BCE].</p><p><strong>Contact :</strong> [adresse e-mail de contact].</p><p><strong>Hébergement :</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis.</p><p>Swoof est actuellement en phase de test.</p>`,
privacy:`<h2 id="legal-title">Politique de confidentialité</h2><h3>Données collectées</h3><p>Prénom, adresse e-mail, langue, pays, code postal et tes réponses au quiz, si tu choisis de les renseigner.</p><h3>Pourquoi ?</h3><p>Personnaliser ton expérience, te donner les bonnes informations pour adopter selon ton lieu de vie et, plus tard, te proposer les refuges proches de chez toi. Ton e-mail ne sert à t'envoyer des nouveautés que si tu as coché la case prévue.</p><h3>Où sont-elles stockées ?</h3><p>Pendant la phase de test, toutes tes données restent enregistrées uniquement sur ton téléphone. Elles ne sont envoyées à personne. Si tu nous envoies ton avis, il nous parvient par e-mail.</p><h3>Tes droits</h3><p>Tu peux modifier ou effacer tes données à tout moment depuis l'accueil de l'app (« Effacer mes données »). Pour toute question : [adresse e-mail de contact].</p><p>Swoof n'utilise pas de cookies publicitaires.</p>`,
terms:`<h2 id="legal-title">Conditions d'utilisation</h2><p>Swoof est un outil gratuit d'aide à la réflexion avant l'adoption d'un chien. Les résultats sont indicatifs : ils ne remplacent pas l'avis d'un vétérinaire, d'un éducateur canin ou d'un refuge.</p><p>Chaque chien est unique : son caractère dépend aussi de son éducation, de sa socialisation et de son histoire.</p><p>Les informations légales (permis, identification, voyages) sont données à titre indicatif et peuvent évoluer : vérifie-les toujours auprès des autorités compétentes.</p><p>Swoof est en phase de test et peut contenir des erreurs. Merci de nous les signaler !</p>`},
en:{mentions:`<h2 id="legal-title">Legal notice</h2><p><strong>Publisher:</strong> [First name Last name or company name], [address], [company number].</p><p><strong>Contact:</strong> [contact email address].</p><p><strong>Hosting:</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA.</p><p>Swoof is currently in its test phase.</p>`,
privacy:`<h2 id="legal-title">Privacy policy</h2><h3>Data collected</h3><p>First name, email address, language, country, postcode and your quiz answers, if you choose to provide them.</p><h3>Why?</h3><p>To personalise your experience, give you the right adoption info for where you live and, later, suggest shelters near you. Your email is only used to send you news if you ticked the box.</p><h3>Where is it stored?</h3><p>During the test phase, all your data stays on your phone only. It is not sent to anyone. If you send us feedback, it reaches us by email.</p><h3>Your rights</h3><p>You can change or delete your data at any time from the app's home screen ("Delete my data"). Questions: [contact email address].</p><p>Swoof does not use advertising cookies.</p>`,
terms:`<h2 id="legal-title">Terms of use</h2><p>Swoof is a free tool to help you think before adopting a dog. Results are indicative: they don't replace advice from a vet, a dog trainer or a shelter.</p><p>Every dog is unique: its temperament also depends on its training, socialisation and history.</p><p>Legal information (permits, identification, travel) is given for guidance only and may change: always check with the relevant authorities.</p><p>Swoof is in its test phase and may contain errors. Please let us know!</p>`},
es:{mentions:`<h2 id="legal-title">Aviso legal</h2><p><strong>Editora:</strong> [Nombre y apellido o nombre de la empresa], [dirección], [número de empresa].</p><p><strong>Contacto:</strong> [correo de contacto].</p><p><strong>Alojamiento:</strong> GitHub Pages, GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, EE. UU.</p><p>Swoof está actualmente en fase de prueba.</p>`,
privacy:`<h2 id="legal-title">Política de privacidad</h2><h3>Datos recogidos</h3><p>Nombre, correo electrónico, idioma, país, código postal y tus respuestas al test, si decides indicarlos.</p><h3>¿Para qué?</h3><p>Para personalizar tu experiencia, darte la información correcta para adoptar según dónde vives y, más adelante, proponerte refugios cercanos. Tu correo solo se usa para enviarte novedades si marcaste la casilla.</p><h3>¿Dónde se guardan?</h3><p>Durante la fase de prueba, todos tus datos se guardan solo en tu teléfono. No se envían a nadie. Si nos envías tu opinión, nos llega por correo.</p><h3>Tus derechos</h3><p>Puedes modificar o borrar tus datos en cualquier momento desde el inicio de la app («Borrar mis datos»). Preguntas: [correo de contacto].</p><p>Swoof no utiliza cookies publicitarias.</p>`,
terms:`<h2 id="legal-title">Condiciones de uso</h2><p>Swoof es una herramienta gratuita para ayudarte a reflexionar antes de adoptar un perro. Los resultados son orientativos: no sustituyen la opinión de un veterinario, un educador canino o un refugio.</p><p>Cada perro es único: su carácter también depende de su educación, socialización e historia.</p><p>La información legal (permisos, identificación, viajes) es orientativa y puede cambiar: compruébala siempre con las autoridades competentes.</p><p>Swoof está en fase de prueba y puede contener errores. ¡Avísanos!</p>`}

const COAT_RULE = {why:tr('le poil que tu aimes','the coat you like','el pelo que te gusta'),warn:tr('pas le poil que tu préfères','not your preferred coat','no es el pelo que prefieres')};
const COAT_FIT = {C:{C:1,D:.7,M:.4,B:.2,L:0},D:{D:1,C:.5,M:.4,B:.3,L:.1},L:{L:1,B:.8,M:.6,D:.2,C:0}};
const life = b => { const n=b.v.split('–').map(Number); return (n[0]+n[1])/2; };
function fit(b,r){
  switch(r.t){
    case 'min': { const x=b[r.f]; return x>=r.v?1:Math.max(0,1-(r.v-x)/2); }
    case 'max': { const x=b[r.f]; return x<=r.v?1:Math.max(0,1-(x-r.v)/2); }
    case 'sizeMax': { const d=SIZES.indexOf(b.g)-SIZES.indexOf(r.v); return d<=0?1:Math.max(0,1-d/2); }
    case 'sizeMin': { const d=SIZES.indexOf(r.v)-SIZES.indexOf(b.g); return d<=0?1:Math.max(0,1-d/2); }
    case 'first': return b.pc==='Oui'?1:b.pc==='Moyen'?.5:0;
    case 'vol': return b.vo==='Cabine'?1:b.vo==='Cabine selon le poids'?.7:.2;
    case 'coat': return Math.max(...r.set.map(c=>COAT_FIT[c][b.pl]??.5));
  }
  return 1;
}
/* Départage : quand deux races sont aussi compatibles, celle qui dépasse le plus nettement tes critères passe devant */
function margin(b,r){
  switch(r.t){
    case 'min': return (b[r.f]-r.v)/4;
    case 'max': return (r.v-b[r.f])/4;
    case 'sizeMax': return (SIZES.indexOf(r.v)-SIZES.indexOf(b.g))/4;
    case 'sizeMin': return (SIZES.indexOf(b.g)-SIZES.indexOf(r.v))/4;
  }
  return 0;
}
function compute(answers){
  const rules=[], flags={}, coats=[];
  QUESTIONS.forEach(q=>{ if(!(q.id in answers)) return; const a=answers[q.id]; if(a===null) return;
    if(a&&q.flag) [].concat(q.flag).forEach(f=>flags[f]=true);
    if(a&&q.coat) coats.push(q.coat);
    (a?(q.yes||[]):(q.no||[])).forEach(r=>rules.push(r)); });
  if(coats.length) rules.push(Object.assign({t:'coat',set:coats,w:2},COAT_RULE));
  const elims=rules.filter(r=>r.t==='elim'||r.t==='elimIn');
  const scored=rules.filter(r=>r.t!=='elim'&&r.t!=='elimIn');
  const max=scored.reduce((s,r)=>s+r.w,0)||1;
  const uniq=arr=>{ const seen=new Set(), out=[]; arr.sort((a,b)=>b[0]-a[0]).forEach(x=>{ if(!seen.has(x[1].fr)){ seen.add(x[1].fr); out.push(x[1]); } }); return out; };
  const all=BREEDS.map(b=>{ let s=0,m=0,pros=[],cons=[],gaps=[];
    scored.forEach(r=>{ const f=fit(b,r); s+=f*r.w; m+=margin(b,r)*r.w; if(f===1&&r.w>=2) pros.push([r.w,r.why]); if(f<.5) cons.push([r.w,r.warn]); if(f<1) gaps.push([r.w*(1-f),r.warn]); });
    const ex=elims.filter(r=> r.t==='elim' ? b[r.f]>r.v : r.vals.includes(b[r.f])).map(r=> r.ex==='plane' ? 'plane_'+({'Nez plat':'flat','Restreint':'restr','Soute':'heavy'})[b.vo] : r.ex);
    return {b,score:s/max+0.03*m/max,pct:Math.round(s/max*100),pros:uniq(pros).slice(0,3),cons:uniq(cons).slice(0,2),gaps:uniq(gaps).slice(0,4),ex};
  });
  const pool=all.filter(x=>!x.ex.length).sort((a,b)=>b.score-a.score || a.b.n.fr.localeCompare(b.b.n.fr));
  pool.forEach((x,i)=>x.rank=i+1);
  return {top:pool.slice(0,4),more:pool.slice(4,10),flags,all,total:pool.length};
}

/* ===== Outils ===== */
let LANG='fr';
const T = k => I18N[LANG][k];
const L = o => (o && typeof o==='object') ? (o[LANG]||o.fr) : o;
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2400); }
const SCREENS=['welcome','home','tuto','quiz','results','history'];
function show(id){ SCREENS.forEach(s=>$('#'+s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }

/* ===== État ===== */
let profile = store.get('swoof-profile', null);
let history = store.get('swoof-history', []);
let answers={}, path=[], idx=0, view=null, lastWish='', editing=false, encShown={};

/* ===== Langue ===== */
function setLang(l){
  LANG=l; document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===l));
  $('#f-email').placeholder=''; $('#f-name').placeholder='';
  const c=$('#f-country'), cur=c.value; c.innerHTML=Object.entries(T('countries')).map(([k,v])=>`<option value="${k}">${v}</option>`).join(''); c.value=cur||'BE';
  if(!$('#home').classList.contains('hidden')) renderHome();
  if(!$('#quiz').classList.contains('hidden')) render();
  if(!$('#results').classList.contains('hidden')) renderResults();
  if(!$('#history').classList.contains('hidden')) renderHistory();
}

/* ===== Inscription ===== */
function fillForm(){
  const p=profile||{}; $('#f-name').value=p.name||''; $('#f-email').value=p.email||''; $('#f-country').value=p.country||'BE'; $('#f-zip').value=p.zip||''; $('#f-news').checked=!!p.news;
}
function submitProfile(e){
  e.preventDefault();
  const email=$('#f-email').value.trim();
  $('#e-email').textContent='';
  /* MODE TEST : tous les champs sont facultatifs (à rendre obligatoires avant le lancement) */
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ $('#e-email').textContent=T('errEmail'); $('#f-email').focus(); return; }
  profile={name:$('#f-name').value.trim(),email,lang:LANG,country:$('#f-country').value,zip:$('#f-zip').value.trim(),news:$('#f-news').checked};
  store.set('swoof-profile',profile); track('inscription');
  if(editing){ editing=false; goHome(); } else show('tuto');
}

/* ===== Accueil connecté ===== */
function renderHome(){
  $('#hello').textContent = profile&&profile.name ? T('hello').replace('{name}',profile.name) : T('hello0');
  $('#h-results').classList.toggle('hidden', !history.length);
}
function goHome(){ if(profile){ renderHome(); show('home'); } else { fillForm(); show('welcome'); } }

/* ===== Quiz ===== */
const visible = q => !q.show || q.show(answers);
function nextIndex(from){ for(let i=from;i<QUESTIONS.length;i++){ if(visible(QUESTIONS[i])) return i; } return -1; }
const totalVisible = () => QUESTIONS.filter(visible).length;
function start(){ answers={}; path=[]; encShown={}; idx=nextIndex(0); show('quiz'); render(); track('quiz_debut'); }
function render(){
  const q=QUESTIONS[idx], done=path.length, total=totalVisible(), pct=Math.round(done/total*100);
  $('#bar').style.width=pct+'%'; $('.progress').setAttribute('aria-valuenow',pct);
  $('#theme').textContent=I18N[LANG].th[q.th]; $('#count').textContent=`${done+1} / ${total}`;
  $('#back').style.visibility=path.length?'visible':'hidden';
  const stage=$('#stage'); stage.innerHTML='';
  if(nextIndex(idx+1)>=0){ const b=document.createElement('div'); b.className='card behind'; b.setAttribute('aria-hidden','true'); stage.appendChild(b); }
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="stamp yes">${T('sYes')}</span><span class="stamp no">${T('sNo')}</span><div class="illu" aria-hidden="true">${ILLU[q.id]||''}</div><h2 class="q" id="qtext">${L(q.q)}</h2><p class="hint">${T('hint')}</p>`;
  c.setAttribute('role','group'); c.setAttribute('aria-labelledby','qtext');
  stage.appendChild(c); drag(c);
}
function encourage(){
  const done=path.length, total=totalVisible(), left=total-done, r=done/total; let i=-1;
  if(left===5) i=3; else if(r>=.75) i=2; else if(r>=.5) i=1; else if(r>=.25) i=0;
  const el=$('#encourage');
  if(i>=0 && !encShown[i]){ encShown[i]=true; el.textContent=T('enc')[i]; el.classList.remove('hidden'); clearTimeout(encourage.t); encourage.t=setTimeout(()=>el.classList.add('hidden'),3200); }
}
function answer(val, card){
  const q=QUESTIONS[idx];
  const go=()=>{ answers[q.id]=val; path.push(idx); const n=nextIndex(idx+1); if(n<0) finish(); else { idx=n; render(); encourage(); } };
  if(card && val!==null && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    card.style.transition='transform .28s ease, opacity .28s ease';
    card.style.transform=`translateX(${val?520:-520}px) rotate(${val?22:-22}deg)`; card.style.opacity='0';
    setTimeout(go,220);
  } else go();
}
function drag(card){
  let x0=null,dx=0; const y=card.querySelector('.stamp.yes'), n=card.querySelector('.stamp.no');
  card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none';});
  card.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; y.style.opacity=Math.max(0,Math.min(1,dx/90)); n.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  const end=()=>{ if(x0===null) return; x0=null; if(Math.abs(dx)>90) answer(dx>0,card); else { card.style.transition='transform .25s ease'; card.style.transform=''; y.style.opacity=0; n.style.opacity=0; } };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
function back(){ if(!path.length) return; idx=path.pop(); delete answers[QUESTIONS[idx].id]; QUESTIONS.forEach(q=>{ if(!visible(q)) delete answers[q.id]; }); render(); }
function finish(){
  history.unshift({date:Date.now(), answers:{...answers}}); history=history.slice(0,10); store.set('swoof-history',history);
  track('quiz_termine'); openResults(answers);
}

/* ===== Résultats ===== */
function region(){
  const c=profile&&profile.country, z=parseInt((profile&&profile.zip)||'',10);
  if(c==='FR') return 'fr';
  if(c==='BE'){ if(isNaN(z)) return 'be'; if(z>=1000&&z<=1299) return 'bru'; if((z>=1300&&z<=1499)||(z>=4000&&z<=7999)) return 'wal'; if((z>=1500&&z<=3999)||(z>=8000&&z<=9999)) return 'fla'; return 'be'; }
  return profile ? 'other' : 'be';
}
function userLL(){
  if(!profile||!profile.zip) return null; const z=profile.zip.replace(/\s/g,'');
  if(profile.country==='BE'){ const n=parseInt(z,10); if(isNaN(n)) return null; if(GEO.be[n]) return GEO.be[n]; let best=null,d=1e9; for(const k in GEO.be){ const dd=Math.abs(k-n); if(dd<d){d=dd;best=GEO.be[k];} } return best; }
  if(profile.country==='FR'){ let d=z.slice(0,2); if(d==='20') d=(parseInt(z,10)>=20200?'2B':'2A'); return GEO.fr[d]||null; }
  return null;
}
function km(a,b){ const R=6371, r=x=>x*Math.PI/180, dl=r(b[0]-a[0]), dn=r(b[1]-a[1]); const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function refugePanel(){
  let body=`<p>${T('refugeP')}</p>`;
  const ll=userLL();
  if(ll){
    const near=REFUGES.map(r=>({r,d:km(ll,r.ll)})).sort((a,b)=>a.d-b.d).slice(0,2);
    body+=`<p style="margin-top:10px"><strong>${T('refugeNear')}</strong></p><ul class="ref-list">${near.map(({r,d})=>`<li class="ref-item"><strong>${esc(r.n)}</strong><small>${esc(r.z)} ${esc(r.c)} · ${T('km').replace('{km}',Math.max(1,Math.round(d/5)*5))}</small><div class="ref-links"><a href="tel:${r.t.replace(/[^0-9+]/g,'')}">📞 ${esc(r.t)}</a><a href="https://${esc(r.w)}" target="_blank" rel="noopener">🌐 ${T('site')}</a></div></li>`).join('')}</ul>`;
  } else if(profile && profile.country && !['BE','FR'].includes(profile.country)) body+=`<p class="note">${T('refugeOther')}</p>`;
  else body+=`<p class="note">${T('refugeNoZip')}</p>`;
  return `<div class="panel refuge"><h3>${T('refugeT')}</h3>${body}</div>`;
}
function openResults(a){ view=compute(a); view.answers=a; lastWish=''; renderResults(); show('results'); }
const VOL_SHORT={fr:{'Cabine':'en cabine','Cabine selon le poids':'en cabine si léger','Soute':'en soute','Nez plat':'déconseillé','Restreint':'restreint'},en:{'Cabine':'in the cabin','Cabine selon le poids':'cabin if light','Soute':'in the hold','Nez plat':'not advised','Restreint':'restricted'},es:{'Cabine':'en cabina','Cabine selon le poids':'cabina si es ligero','Soute':'en bodega','Nez plat':'desaconsejado','Restreint':'restringido'}};
function card(m,i){
  const fl=view.flags;
  return `<article class="match ${i===0?'first':''}">
    <h2>${esc(L(m.b.n))}${m.b.cr?` <span class="cross">${T('cross')}</span>`:''}</h2>
    <div class="pct">${m.pct} %<small> ${T('compat')}</small></div>
    <div class="bar"><span style="width:${m.pct}%"></span></div>
    <dl class="facts"><div><dt>${T('size')}</dt><dd>${L(SIZE_L[m.b.g])}</dd></div><div><dt>${T('weight')}</dt><dd>${m.b.p} kg</dd></div><div><dt>${T('life')}</dt><dd>${m.b.v} ${T('years')}</dd></div></dl>
    <p class="car">${esc(L(m.b.car))}.</p>
    ${fl.plane?`<p class="vig"><strong>${T('plane')}</strong> ${VOL_SHORT[LANG][m.b.vo]}</p>`:''}
    ${m.pros.length?`<ul class="tags good">${m.pros.map(p=>`<li>${L(p)}</li>`).join('')}</ul>`:''}
    ${m.cons.length?`<ul class="tags warn">${m.cons.map(p=>`<li>${L(p)}</li>`).join('')}</ul>`:''}
    <p class="vig">${T('know')} ${esc(L(m.b.vig))}.</p></article>`;
}
function renderResults(){
  const v=view, fl=v.flags;
  $('#r-title').textContent = profile&&profile.name ? T('rTitle').replace('{name}',profile.name) : T('rTitle0');
  $('#matches').innerHTML=`<div class="grid2">${v.top.map(card).join('')}</div>`
    + (v.more.length?`<button class="btn btn-soft" id="moreBtn" aria-expanded="false" aria-controls="moreList" style="margin-top:12px">${T('more')}</button>
      <div id="moreList" class="more hidden" style="margin-top:12px"><h3 style="font-size:20px">${T('moreT')}</h3>${v.more.map(m=>`<details class="mini-match"><summary><span class="mm-name">${esc(L(m.b.n))}${m.b.cr?` <span class="cross">${T('cross')}</span>`:''}<small>${L(SIZE_L[m.b.g])}</small></span><span class="mm-pct">${m.pct} %</span></summary><div class="mm-body">${card(m,9).replace('<article class="match ">','<div>').replace('</article>','</div>')}</div></details>`).join('')}</div>`:'');
  const mb=$('#moreBtn'); if(mb) mb.onclick=()=>{ const l=$('#moreList'); const open=l.classList.toggle('hidden')===false; mb.setAttribute('aria-expanded',open); mb.textContent=open?T('less'):T('more'); };
  const panel=(t,p,cls='')=>`<div class="panel ${cls}"><h3>${t}</h3><p>${p}</p></div>`;
  let x=refugePanel();
  x+=`<div class="panel wish"><h3>${T('wishT')}</h3><p>${T('wishP')}</p><label class="lbl" for="wishSel">${T('wishL')}</label><select id="wishSel"><option value="">${T('wishPick')}</option>${[...BREEDS].sort((a,b)=>L(a.n).localeCompare(L(b.n),LANG)).map(b=>`<option value="${esc(b.n.fr)}" ${b.n.fr===lastWish?'selected':''}>${esc(L(b.n))}</option>`).join('')}</select><div id="wishOut" aria-live="polite"></div></div>`;
  if(fl.senior) x+=panel(T('seniorT'),T('seniorP'));
  if(fl.plane) x+=panel(T('planeT'),T('planeP'));
  if(fl.allergy) x+=panel(T('allergyT'),T('allergyP'));
  if(fl.alone) x+=panel(T('aloneT'),T('aloneP'));
  const rg=region(), where=T('adoptWhere')[rg];
  x+=`<div class="panel"><h3>${T('adoptT')}${where?' '+where:''}</h3><ul>${[...T('adopt')[rg],...T('adopt').all].map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
  x+=`<div class="panel" id="fb"><h3>${T('fbT')}</h3><p>${T('fbP')}</p><span class="lbl">${T('fbRate')}</span><div class="stars" role="radiogroup" aria-label="${T('fbRate')}">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" role="radio" aria-checked="false" aria-label="${n}/5">★</button>`).join('')}</div><textarea id="fbText" placeholder="${T('fbPh')}"></textarea><button class="btn btn-primary" id="fbSend" style="margin-top:12px">${T('fbSend')}</button></div>`;
  if(fl.travel) x+=`<div class="panel ebook"><h3>${T('ebookT')}</h3><p>${T('ebookP')}</p><a class="btn btn-primary" href="${EBOOK_URL}" target="_blank" rel="noopener" id="ebookBtn">${T('ebookB')}</a></div>`;
  $('#extras').innerHTML=x;
  $('#wishSel').onchange=renderWish; renderWish();
  const eb=$('#ebookBtn'); if(eb) eb.onclick=()=>track('clic_ebook');
  let rating=0; document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{ rating=+b.dataset.star; document.querySelectorAll('[data-star]').forEach(s=>{ const on=+s.dataset.star<=rating; s.classList.toggle('on',on); s.setAttribute('aria-checked', +s.dataset.star===rating); }); });
  $('#fbSend').onclick=()=>sendFeedback(rating);
}
function renderWish(){
  const sel=$('#wishSel'), out=$('#wishOut'); lastWish=sel.value; if(!lastWish){ out.innerHTML=''; return; }
  const x=view.all.find(a=>a.b.n.fr===lastWish), name=esc(L(x.b.n)); let h='';
  if(x.ex.length) h=`<p><strong>${T('wishEx').replace('{breed}',name)}</strong></p><ul>${x.ex.map(r=>`<li>${T('ex_'+r)}</li>`).join('')}</ul>`;
  else if(x.rank<=4) h=`<p><strong>${T('wishTop').replace('{breed}',name)}</strong></p>`;
  else { h=`<p><strong>${T('wishRank').replace('{breed}',name).replace('{rank}',x.rank).replace('{total}',view.total).replace('{pct}',x.pct)}</strong></p>`;
    h+= x.gaps.length ? `<p>${T('wishGaps')}</p><ul class="tags warn">${x.gaps.map(g=>`<li>${L(g)}</li>`).join('')}</ul>` : `<p>${T('wishClose')}</p>`;
    if(x.pros.length) h+=`<p style="margin-top:10px">${T('wishPros')}</p><ul class="tags good">${x.pros.map(g=>`<li>${L(g)}</li>`).join('')}</ul>`; }
  h+=`<p class="vig" style="margin-top:10px">${T('know')} ${esc(L(x.b.vig))}.</p>`;
  if(x.ex.length || x.rank>4) h+=`<p class="note" style="margin-top:8px">${T('wishNote')}</p>`;
  out.innerHTML=h;
}
function sendFeedback(rating){
  if(!rating){ toast(T('fbNeed')); return; }
  const text=$('#fbText').value.trim();
  const fb=store.get('swoof-feedback',[]); fb.push({date:Date.now(),rating,text,lang:LANG}); store.set('swoof-feedback',fb);
  track('avis',{rating});
  if(FEEDBACK_EMAIL){
    const body=`Note : ${rating}/5\n\n${text}\n\nTop 4 : ${view.top.map(m=>m.b.n.fr).join(', ')}\nLangue : ${LANG}`;
    location.href=`mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent('Avis Swoof – '+rating+'/5')}&body=${encodeURIComponent(body)}`;
  }
  $('#fb').innerHTML=`<h3>${T('fbThanks')}</h3>`;
}

/* ===== Story Instagram ===== */
async function shareStory(){
  try{
    await document.fonts.ready;
    const W=1080,H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
    g.fillStyle='#FFF4E6'; g.fillRect(0,0,W,H);
    g.fillStyle='#FCE7DC'; g.beginPath(); g.arc(W/2,-200,900,0,Math.PI*2); g.fill();
    const logo=new Image(); logo.src=LOGO_URL; await logo.decode();
    const lw=300, lh=lw*205/288; g.drawImage(logo,(W-lw)/2-120,180,lw,lh);
    g.fillStyle='#2A1E18'; g.font='700 150px Fredoka, Trebuchet MS, sans-serif'; g.textBaseline='middle'; g.fillText('Swoof',(W-lw)/2+190,180+lh/2);
    g.textAlign='center'; g.font='600 76px Fredoka, Trebuchet MS, sans-serif'; g.fillText(T('storyT'),W/2,560);
    view.top.forEach((m,i)=>{ const y=680+i*230; g.fillStyle=i===0?'#E86A4F':'#FFFDF9'; roundRect(g,90,y,W-180,190,48); g.fill(); g.strokeStyle='#EBDAC6'; g.lineWidth=4; if(i) g.stroke();
      g.fillStyle=i===0?'#fff':'#2A1E18'; g.textAlign='left'; g.font='600 58px Fredoka, Trebuchet MS, sans-serif'; fitText(g,L(m.b.n),150,y+95,640);
      g.textAlign='right'; g.font='700 70px Fredoka, Trebuchet MS, sans-serif'; g.fillStyle=i===0?'#fff':'#B8452D'; g.fillText(m.pct+' %',W-150,y+95); });
    g.textAlign='center'; g.fillStyle='#2A1E18'; g.font='600 52px Nunito, Trebuchet MS, sans-serif'; g.fillText(T('storyF'),W/2,1650);
    g.fillStyle='#B8452D'; g.font='700 56px Fredoka, Trebuchet MS, sans-serif'; g.fillText(T('tag'),W/2,1740);
    g.fillStyle='#6B5549'; g.font='600 40px Nunito, Trebuchet MS, sans-serif'; g.fillText(APP_URL,W/2,1820);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png')); const file=new File([blob],'swoof.png',{type:'image/png'});
    track('partage_story');
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], text:T('shareText').replace('{list}',view.top.map(m=>L(m.b.n)).join(', '))}); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='swoof.png'; document.body.appendChild(a); a.click(); a.remove(); toast(T('saved'));
  }catch(e){ if(e && e.name==='AbortError') return; toast(T('noShare')); }
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitText(g,t,x,y,max){ let s=58; while(g.measureText(t).width>max && s>30){ s-=2; g.font=`600 ${s}px Fredoka, Trebuchet MS, sans-serif`; } g.fillText(t,x,y); }

/* ===== Historique ===== */
function renderHistory(){
  const fmt=new Intl.DateTimeFormat(LANG==='fr'?'fr-BE':LANG,{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  $('#hist-list').innerHTML = history.length ? history.map((h,i)=>{ const r=compute(h.answers); return `<button class="hist-item" data-h="${i}"><span><strong>${r.top.map(m=>esc(L(m.b.n))).join(', ')}</strong><br><small>${fmt.format(new Date(h.date))}</small></span><span aria-hidden="true">›</span></button>`; }).join('') : `<p class="note">${T('histEmpty')}</p>`;
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>openResults(history[+b.dataset.h].answers));
}

/* ===== Pages légales ===== */
function openLegal(k){ $('#legal-body').innerHTML=LEGAL[LANG][k]; $('#legal').classList.remove('hidden'); $('#legal-close').focus(); }

/* ===== Démarrage ===== */
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll('[data-home]').forEach(b=>{ b.onclick=goHome; b.setAttribute('aria-label','Swoof'); });
document.querySelectorAll('[data-legal]').forEach(b=>b.onclick=()=>openLegal(b.dataset.legal));
$('#legal-close').onclick=()=>$('#legal').classList.add('hidden');
$('#legal').onclick=e=>{ if(e.target.id==='legal') $('#legal').classList.add('hidden'); };
$('#profile').addEventListener('submit',submitProfile);
$('#h-start').onclick=()=>show('tuto');
$('#h-results').onclick=()=>{ renderHistory(); show('history'); };
$('#h-edit').onclick=()=>{ editing=true; fillForm(); show('welcome'); };
$('#h-delete').onclick=()=>{ if(confirm(T('confirmDelete'))){ ['swoof-profile','swoof-history','swoof-feedback'].forEach(k=>store.del(k)); profile=null; history=[]; fillForm(); show('welcome'); toast(T('deleted')); } };
$('#t-go').onclick=start;
$('#btnYes').onclick=()=>answer(true,document.querySelector('.card:not(.behind)'));
$('#btnNo').onclick=()=>answer(false,document.querySelector('.card:not(.behind)'));
$('#skip').onclick=()=>answer(null,null);
$('#back').onclick=back; $('#quit').onclick=()=>show('tuto'); $('#restart').onclick=()=>show('tuto'); $('#restart2').onclick=()=>show('tuto');
$('#share').onclick=shareStory;
document.addEventListener('keydown',e=>{ if($('#quiz').classList.contains('hidden')) return; if(e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight') answer(true,document.querySelector('.card:not(.behind)'));
  if(e.key==='ArrowLeft') answer(false,document.querySelector('.card:not(.behind)')); });
(function init(){
  let l=profile&&profile.lang; if(!l){ const n=(navigator.language||'fr').slice(0,2); l=['fr','en','es'].includes(n)?n:'fr'; }
  setLang(l); fillForm(); goHome();
})();
