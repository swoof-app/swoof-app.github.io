<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swoof – Matche avec le chien de ta vie</title>
<meta name="theme-color" content="#E86A4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Swoof">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4E6; --card:#FFFDF9; --ink:#2A1E18; --muted:#6B5549; --line:#EBDAC6;
  --coral:#E86A4F; --coral-strong:#B8452D; --coral-soft:#FBE1D8; --good:#2F7A45; --good-soft:#DDF0E0; --warn:#9A5A0B; --warn-soft:#FCEBD0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1510; --card:#2B201A; --ink:#FFF4E6; --muted:#CDB9A8; --line:#47372D;
    --coral:#F07A60; --coral-strong:#E86A4F; --coral-soft:#4A2A22; --good:#8FD19E; --good-soft:#1F3A27; --warn:#F2B866; --warn-soft:#3F2E17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1510; --card:#2B201A; --ink:#FFF4E6; --muted:#CDB9A8; --line:#47372D;
  --coral:#F07A60; --coral-strong:#E86A4F; --coral-soft:#4A2A22; --good:#8FD19E; --good-soft:#1F3A27; --warn:#F2B866; --warn-soft:#3F2E17;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding:20px 20px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Logo */
.wordmark{display:inline-flex;align-items:flex-end;gap:1px;font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1}
.wordmark svg{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.topbar .wordmark{font-size:28px}
.topbar .wordmark svg{width:34px;height:24px;margin-bottom:2px}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 4px;min-height:44px}
.linkbtn:hover{color:var(--ink)}

/* Welcome */
#welcome{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:24px 0}
#welcome .wordmark{font-size:clamp(76px,22vw,112px)}
#welcome .wordmark svg{width:clamp(88px,26vw,130px);height:auto;margin-bottom:.06em}
.promise{font-family:'Fredoka',sans-serif;font-size:clamp(26px,7vw,32px);font-weight:500;max-width:15ch}
.intro{color:var(--muted);max-width:34ch;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 28px;border-radius:999px;border:2px solid transparent;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;text-decoration:none}
.btn-primary{background:var(--coral-strong);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.demo-stack{position:relative;height:120px;margin-top:4px}
.mini{position:absolute;left:0;top:0;width:210px;height:110px;border-radius:22px;background:var(--card);border:2px solid var(--line);padding:16px 18px;font-family:'Fredoka',sans-serif;font-size:17px}
.mini.b{transform:translate(18px,8px) rotate(5deg);opacity:.7}
.mini.a{transform:rotate(-3deg);z-index:1}

/* Quiz */
#quiz{flex:1;display:flex;flex-direction:column;gap:18px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--coral);border-radius:99px;transition:width .3s ease}
.theme-label{color:var(--muted);font-weight:600;font-size:15px;margin:0}
.stage{position:relative;flex:1;min-height:340px;display:flex;align-items:stretch}
.card{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:32px 26px;display:flex;flex-direction:column;justify-content:space-between;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;box-shadow:0 18px 40px -24px rgba(42,30,24,.35)}
.card.behind{transform:scale(.95) translateY(14px);opacity:.6;box-shadow:none}
.card .q{font-family:'Fredoka',sans-serif;font-size:clamp(25px,6.6vw,30px);font-weight:600;line-height:1.2}
.card .hint{color:var(--muted);font-size:15px;margin:14px 0 0}
.card .nose{align-self:flex-end;opacity:.9}
.stamp{position:absolute;top:26px;padding:6px 16px;border-radius:12px;border:3px solid;font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;opacity:0;pointer-events:none}
.stamp.yes{left:22px;color:var(--good);border-color:var(--good);transform:rotate(-10deg)}
.stamp.no{right:22px;color:var(--coral-strong);border-color:var(--coral-strong);transform:rotate(10deg)}
.controls{display:flex;align-items:center;justify-content:center;gap:26px}
.round{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--card);font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;gap:2px}
.round svg{width:26px;height:26px}
.round.yes{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff}
.round:hover{transform:translateY(-1px)}
.under{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.count{font-variant-numeric:tabular-nums}

/* Results */
#results{display:flex;flex-direction:column;gap:22px}
#results h1{font-size:clamp(30px,8vw,38px)}
.lead{color:var(--muted);margin:6px 0 0}
.match{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px 20px 18px}
.match.first{border-color:var(--coral)}
.match-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.match h2{font-size:24px}
.pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;color:var(--coral-strong);white-space:nowrap}
.pct small{font-size:15px;font-weight:500;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;margin:10px 0 14px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--coral);border-radius:99px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.facts div{background:var(--bg);border-radius:14px;padding:8px 10px}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-size:15px}
.car{margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0;list-style:none}
.tags li{font-size:14px;padding:4px 10px;border-radius:99px;font-weight:600}
.tags.good li{background:var(--good-soft);color:var(--good)}
.tags.warn li{background:var(--warn-soft);color:var(--warn)}
.vig{font-size:14.5px;color:var(--muted);margin:6px 0 0}
.panel{border-radius:26px;padding:20px;background:var(--card);border:2px solid var(--line)}
.panel h3{font-size:21px;margin-bottom:8px}
.panel p{margin:0 0 10px}
.panel ul{margin:0;padding-left:20px}
.panel li{margin-bottom:6px}
.panel.ebook{background:var(--coral-soft);border-color:var(--coral)}
.panel.refuge{border-style:dashed}
.note{font-size:14px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.illu{height:150px;margin:-10px -8px 18px;border-radius:22px;background:#FCE7DC;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.illu svg{width:100%;height:100%;display:block}
.welcome-illu{height:190px;border-radius:28px;background:#FCE7DC;overflow:hidden}
.welcome-illu svg{width:100%;height:100%;display:block}
.card .q{font-size:clamp(23px,6vw,28px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand .word{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1}
.hero .brand svg{width:78px;height:65px}
.hero .brand .word{font-size:clamp(52px,15vw,68px)}
.topbar .brand svg{width:38px;height:32px}
.topbar .brand .word{font-size:26px}
.hero{display:flex;flex-direction:column;gap:18px;padding:12px 0 8px}
.form{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px}
.field label,.field .lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field input[type=text],.field input[type=email]{width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit}
.field input:focus{border-color:var(--coral);outline:none}
.err{color:var(--coral-strong);font-size:14px;font-weight:600;min-height:0;margin:4px 0 0}
.err:empty{display:none}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-btn{min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.lang-btn[aria-pressed=true]{border-color:var(--coral-strong);background:var(--coral-soft);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--coral-strong);flex:none}
.privacy{font-size:13.5px;color:var(--muted);margin:0}

.tagline{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;letter-spacing:.02em;color:var(--coral-strong);margin:-6px 0 0}
.tagline.end{text-align:center;margin:4px 0 0}
.home-btn{background:none;border:0;padding:4px 0;min-height:44px;color:var(--ink);display:flex;align-items:center}
.home-btn:hover .word{color:var(--coral-strong)}
.cross{display:inline-block;vertical-align:middle;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.more{display:flex;flex-direction:column;gap:10px}
.more-title{font-size:20px;margin:6px 0 2px}
.mini-match{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.mini-match summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;cursor:pointer;min-height:56px}
.mini-match summary::-webkit-details-marker{display:none}
.mm-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;line-height:1.2}
.mm-name small{display:block;font-family:'Nunito',sans-serif;font-weight:600;font-size:13.5px;color:var(--muted)}
.mm-pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;color:var(--coral-strong);white-space:nowrap}
.mini-match[open] summary{border-bottom:2px solid var(--line)}
.mm-body{padding:4px 18px 16px}
.wish select{width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;margin-bottom:12px}
.wish .lbl{display:block;font-weight:700;font-size:15px;margin:4px 0 6px}
.wish ul:not(.tags){margin:0 0 10px;padding-left:20px}
#wishOut .tags{margin-bottom:10px}

const life = b => { const n=b.v.split('–').map(Number); return (n[0]+n[1])/2; };
function fit(b,r){
  switch(r.t){
    case 'min': { const x=b[r.f]; return x>=r.v?1:Math.max(0,1-(r.v-x)/2); }
    case 'max': { const x=b[r.f]; return x<=r.v?1:Math.max(0,1-(x-r.v)/2); }
    case 'sizeMax': { const d=SIZES.indexOf(b.g)-SIZES.indexOf(r.v); return d<=0?1:Math.max(0,1-d/2); }
    case 'sizeMin': { const d=SIZES.indexOf(r.v)-SIZES.indexOf(b.g); return d<=0?1:Math.max(0,1-d/2); }
    case 'first': return b.pc==='Oui'?1:b.pc==='Moyen'?.5:0;
    case 'vol': return b.vo==='Cabine'?1:b.vo==='Cabine selon le poids'?.7:.2;
    case 'sizeEq': { const d=Math.abs(SIZES.indexOf(b.g)-SIZES.indexOf(r.v)); return d===0?1:d===1?.4:0; }
    case 'coat': { const m = r.want==='short' ? {C:1,D:.7,M:.4,B:.2,L:0} : r.want==='wire' ? {D:1,C:.5,M:.3,B:.3,L:0} : {L:1,B:.8,M:.5,D:.2,C:0}; return m[b.pl] ?? .5; }
    case 'notIn': return r.vals.includes(b[r.f])?0:1;
    case 'life': { const x=life(b); return x>=r.v?1:Math.max(0,1-(r.v-x)/3); }
  }
  return 1;
}

  try{ localStorage.setItem('swoof-lang', l); }catch(e){}
  if(!$('#quiz').classList.contains('hidden')) render();
  if(!$('#results').classList.contains('hidden')) renderResults();
}

const visible = q => !q.show || q.show(answers);
function nextIndex(from){ for(let i=from;i<QUESTIONS.length;i++){ if(visible(QUESTIONS[i])) return i; } return -1; }
const totalVisible = () => QUESTIONS.filter(visible).length;
function show(id){ ['welcome','quiz','results'].forEach(s=>$('#'+s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }

function submitProfile(e){
  e.preventDefault();
  const name=$('#f-name').value.trim(), email=$('#f-email').value.trim();
  let ok=true;
  $('#e-name').textContent=''; $('#e-email').textContent='';
  /* MODE TEST : prénom et e-mail facultatifs (à réactiver avant le lancement) */
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ $('#e-email').textContent=T('errEmail'); ok=false; }
  if(!ok){ $('#f-email').focus(); return; }
  profile={name,email,news:$('#f-news').checked};
  try{ localStorage.setItem('swoof-name', name); }catch(e){}
  start();
}
function start(){ answers={}; path=[]; idx=nextIndex(0); show('quiz'); render(); }

function render(){
  const q=QUESTIONS[idx], done=path.length, total=totalVisible(), pct=Math.round(done/total*100);
  $('#bar').style.width=pct+'%';
  $('.progress').setAttribute('aria-valuenow',pct);
  $('#theme').textContent=I18N[LANG].th[q.th];
  $('#count').textContent=`${done+1} / ${total}`;
  $('#back').style.visibility=path.length?'visible':'hidden';
  const stage=$('#stage'); stage.innerHTML='';
  if(nextIndex(idx+1)>=0){ const b=document.createElement('div'); b.className='card behind'; b.setAttribute('aria-hidden','true'); stage.appendChild(b); }
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="stamp yes">${T('sYes')}</span><span class="stamp no">${T('sNo')}</span>
    <div><div class="illu" aria-hidden="true">${ILLU[THEME_ILLU[q.th]]||''}</div><h2 class="q" id="qtext">${L(q.q)}</h2><p class="hint">${T('hint')}</p></div>`;
  c.setAttribute('role','group'); c.setAttribute('aria-labelledby','qtext');
  stage.appendChild(c); drag(c);
}

function answer(val, card){
  const q=QUESTIONS[idx];
  const go=()=>{ answers[q.id]=val; path.push(idx); const n=nextIndex(idx+1); if(n<0) results(); else { idx=n; render(); } };
  if(card && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    card.style.transition='transform .28s ease, opacity .28s ease';
    card.style.transform=`translateX(${val?520:-520}px) rotate(${val?22:-22}deg)`; card.style.opacity='0';
    setTimeout(go,220);
  } else go();
}
function drag(card){
  let x0=null,dx=0; const y=card.querySelector('.stamp.yes'), n=card.querySelector('.stamp.no');
  card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none';});
  card.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; y.style.opacity=Math.max(0,Math.min(1,dx/90)); n.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  const end=()=>{ if(x0===null) return; x0=null; if(Math.abs(dx)>90) answer(dx>0,card); else { card.style.transition='transform .25s ease'; card.style.transform=''; y.style.opacity=0; n.style.opacity=0; } };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
function back(){ if(!path.length) return; idx=path.pop(); delete answers[QUESTIONS[idx].id]; QUESTIONS.forEach(q=>{ if(!visible(q)) delete answers[q.id]; }); render(); }

function compute(){
  const rules=[], flags={};
  QUESTIONS.forEach(q=>{ if(!(q.id in answers)) return; const a=answers[q.id]; if(a&&q.flag) flags[q.flag]=true; (a?(q.yes||[]):(q.no||[])).forEach(r=>rules.push(r)); });
  const elims=rules.filter(r=>r.t==='elim'||r.t==='elimIn');
  const scored=rules.filter(r=>r.t!=='elim'&&r.t!=='elimIn');
  const max=scored.reduce((s,r)=>s+r.w,0)||1;
  const uniq=arr=>{ const seen=new Set(), out=[]; arr.sort((a,b)=>b[0]-a[0]).forEach(x=>{ if(!seen.has(x[1].fr)){ seen.add(x[1].fr); out.push(x[1]); } }); return out; };
  const all=BREEDS.map(b=>{ let s=0,pros=[],cons=[],gaps=[];
    scored.forEach(r=>{ const f=fit(b,r); s+=f*r.w; if(f===1&&r.w>=2) pros.push([r.w,r.why]); if(f<.5) cons.push([r.w,r.warn]); if(f<1) gaps.push([r.w*(1-f),r.warn]); });
    const ex=elims.filter(r=> r.t==='elim' ? b[r.f]>r.v : r.vals.includes(b[r.f])).map(r=> r.ex==='plane' ? 'plane_'+({'Nez plat':'flat','Restreint':'restr','Soute':'heavy'})[b.vo] : r.ex);
    return {b,pct:Math.round(s/max*100),pros:uniq(pros).slice(0,3),cons:uniq(cons).slice(0,2),gaps:uniq(gaps).slice(0,4),ex};
  });
  const pool=all.filter(x=>!x.ex.length).sort((a,b)=>b.pct-a.pct || a.b.n.fr.localeCompare(b.b.n.fr));
  pool.forEach((x,i)=>x.rank=i+1);
  return {top:pool.slice(0,4),more:pool.slice(4,10),flags,all,total:pool.length};
}
function renderWish(){
  const sel=$('#wishSel'), out=$('#wishOut'); if(!sel||!out) return;
  lastWish=sel.value; if(!lastWish){ out.innerHTML=''; return; }
  const x=lastAll.find(a=>a.b.n.fr===lastWish); const name=L(x.b.n);
  let h='';
  if(x.ex.length){
    h=`<p><strong>${T('wishEx').replace('{breed}',name)}</strong></p><ul>${x.ex.map(r=>`<li>${T('ex_'+r)}</li>`).join('')}</ul>`;
  } else if(x.rank<=4){
    h=`<p><strong>${T('wishTop').replace('{breed}',name)}</strong></p>`;
  } else {
    h=`<p><strong>${T('wishRank').replace('{breed}',name).replace('{rank}',x.rank).replace('{total}',lastTotal).replace('{pct}',x.pct)}</strong></p>`;
    h+= x.gaps.length ? `<p>${T('wishGaps')}</p><ul class="tags warn">${x.gaps.map(g=>`<li>${L(g)}</li>`).join('')}</ul>` : `<p>${T('wishClose')}</p>`;
    if(x.pros.length) h+=`<p>${T('wishPros')}</p><ul class="tags good">${x.pros.map(g=>`<li>${L(g)}</li>`).join('')}</ul>`;
  }
  h+=`<p class="vig">${T('know')} ${L(x.b.vig)}.</p>`;
  if(x.rank!==undefined && x.rank>4 || x.ex.length) h+=`<p class="note">${T('wishNote')}</p>`;
  out.innerHTML=h;
}

function results(){ const r=compute(); lastTop=r.top; lastMore=r.more; lastFlags=r.flags; lastAll=r.all; lastTotal=r.total; lastWish=''; renderResults(); show('results'); }
function renderResults(){
  const flags=lastFlags;
  $('#r-title').textContent=profile.name ? T('rTitle').replace('{name}',profile.name) : T('rTitle0');
  const detail=m=>`<div class="bar"><span style="width:${m.pct}%"></span></div>
      <dl class="facts"><div><dt>${T('size')}</dt><dd>${L(SIZE_L[m.b.g])}</dd></div><div><dt>${T('weight')}</dt><dd>${m.b.p} kg</dd></div><div><dt>${T('life')}</dt><dd>${m.b.v} ${T('years')}</dd></div></dl>
      <p class="car">${L(m.b.car)}.</p>
      ${flags.plane?`<p class="vig"><strong>${T('plane')}</strong> ${T('vol')[m.b.vo]}</p>`:''}
      ${m.pros.length?`<ul class="tags good" aria-label="${T('whyA')}">${m.pros.map(p=>`<li>${L(p)}</li>`).join('')}</ul>`:''}
      ${m.cons.length?`<ul class="tags warn" aria-label="${T('warnA')}">${m.cons.map(p=>`<li>${L(p)}</li>`).join('')}</ul>`:''}
      <p class="vig">${T('know')} ${L(m.b.vig)}.</p>
    `;
  $('#matches').innerHTML=lastTop.map((m,i)=>`<article class="match ${i===0?'first':''}"><div class="match-head"><h2>${L(m.b.n)}${m.b.cr?` <span class="cross">${T('cross')}</span>`:''}</h2><span class="pct">${m.pct} %<small> ${T('compat')}</small></span></div>${detail(m)}</article>`).join('')
    + (lastMore.length?`<button class="btn btn-ghost" id="moreBtn" aria-expanded="false" aria-controls="moreList">${T('more')}</button>
    <div id="moreList" class="more hidden"><h3 class="more-title">${T('moreT')}</h3>${lastMore.map(m=>`<details class="mini-match"><summary><span class="mm-name">${L(m.b.n)}${m.b.cr?` <span class="cross">${T('cross')}</span>`:''}<small>${L(SIZE_L[m.b.g])}</small></span><span class="mm-pct">${m.pct} %</span></summary><div class="mm-body">${detail(m)}</div></details>`).join('')}</div>`:'');
  const mb=$('#moreBtn'); if(mb) mb.onclick=()=>{ const l=$('#moreList'); const open=l.classList.toggle('hidden')===false; mb.setAttribute('aria-expanded',open); mb.textContent=open?T('less'):T('more'); };
  let x=`<div class="panel wish"><h3>${T('wishT')}</h3><p>${T('wishP')}</p><label class="lbl" for="wishSel">${T('wishL')}</label><select id="wishSel"><option value="">${T('wishPick')}</option>${[...BREEDS].sort((a,b)=>L(a.n).localeCompare(L(b.n),LANG)).map(b=>`<option value="${b.n.fr}" ${b.n.fr===lastWish?'selected':''}>${L(b.n)}</option>`).join('')}</select><div id="wishOut" aria-live="polite"></div></div>`;
  const panel=(t,p,cls='')=>`<div class="panel ${cls}"><h3>${t}</h3><p>${p}</p></div>`;
  if(flags.plane) x+=panel(T('planeT'),T('planeP'));
  if(flags.allergy) x+=panel(T('allergyT'),T('allergyP'));
  if(flags.alone) x+=panel(T('aloneT'),T('aloneP'));
  x+=`<div class="panel"><h3>${T('adoptT')}</h3><ul>${T('adopt').map(a=>`<li>${a}</li>`).join('')}</ul></div>`;
  x+=panel(T('refugeT'),T('refugeP'),'refuge');
  if(flags.travel) x+=`<div class="panel ebook"><h3>${T('ebookT')}</h3><p>${T('ebookP')}</p><button class="btn btn-primary" id="ebookBtn">${T('ebookB')}</button></div>`;
  $('#extras').innerHTML=x;
  $('#wishSel').onchange=renderWish; renderWish();
  const eb=$('#ebookBtn'); if(eb) eb.onclick=()=>toast(T('ebookSoon'));
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
async function share(){
  const text=T('shareText').replace('{list}', lastTop.map(m=>`${L(m.b.n)} (${m.pct} %)`).join(', '));
  try{ if(navigator.share){ await navigator.share({title:'Swoof',text}); return; } await navigator.clipboard.writeText(text); toast(T('copied')); }
  catch(e){ if(e && e.name==='AbortError') return; toast(T('noShare')); }
}

document.getElementById('wIllu').innerHTML=ILLU.accueil;
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('welcome'));
$('#profile').addEventListener('submit',submitProfile);
$('#btnYes').onclick=()=>answer(true,document.querySelector('.card:not(.behind)'));
$('#btnNo').onclick=()=>answer(false,document.querySelector('.card:not(.behind)'));
$('#back').onclick=back; $('#quit').onclick=start; $('#restart').onclick=start; $('#restart2').onclick=start; $('#share').onclick=share;
document.addEventListener('keydown',e=>{ if($('#quiz').classList.contains('hidden')) return; if(e.target.closest('input')) return;
  if(e.key==='ArrowRight') answer(true,document.querySelector('.card:not(.behind)'));
  if(e.key==='ArrowLeft') answer(false,document.querySelector('.card:not(.behind)')); });
(function init(){
  let l='fr'; try{ l=localStorage.getItem('swoof-lang')||''; }catch(e){}
  if(!l){ const n=(navigator.language||'fr').slice(0,2); l=['fr','en','es'].includes(n)?n:'fr'; }
  try{ const nm=localStorage.getItem('swoof-name'); if(nm) $('#f-name').value=nm; }catch(e){}
  setLang(l);
})();

</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
